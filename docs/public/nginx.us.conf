# Nginx configuration for the US documentation site (docs.us.ovhcloud.com)
#
# Same URL scheme as the worldwide site: every page sits under a /{locale}/
# prefix, so a second locale (/es/) can be added without moving any URL.
# Build output (after `pnpm build:us`):
#   dist/
#     index.html (redirect to /en/), 301.map, sitemap.xml, robots.txt
#     en/404.html, en/bare-metal-cloud/foo.html, en/pagefind/, ...
#
# cleanUrls: true → /en/bare-metal-cloud/foo serves /en/bare-metal-cloud/foo.html
#
# Markdown for agents: every page has a sibling `<page>.md`, served as
# text/markdown. A request carrying `Accept: text/markdown` on the clean URL
# gets that Markdown directly (content negotiation, `Vary: Accept`).
#
# This file is a conf.d include (http context), which is where `map` must live.

map $http_accept $md_suffix {
    default "";
    "~*text/markdown" ".md";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `.md` is absent from the stock mime.types; extend it rather than replace
    # it (a lone `types {}` block would drop every inherited mapping).
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    charset utf-8;
    charset_types text/markdown text/plain;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Vary "Accept" always;

    # Root → default locale
    location = / {
        return 302 /en/;
    }

    # Per-locale: cleanUrls + locale-specific 404
    location /en/ {
        try_files $uri$md_suffix $uri $uri.html $uri/ /en/404.html;
    }

    # Fallback
    location / {
        try_files $uri$md_suffix $uri $uri.html $uri/ /en/404.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # AI indexes and per-page Markdown: short cache, regenerated every deploy.
    # (Regex locations win over the per-locale prefixes above, hence the
    # explicit 404.)
    location ~* (\.md|/llms(-full)?\.txt)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # No cache on HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
