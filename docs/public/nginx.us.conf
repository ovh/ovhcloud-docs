# Nginx configuration for the US documentation site (docs.us.ovhcloud.com)
#
# Single-locale region (English) served at the domain root — no /{locale}/
# prefix and no root redirect. Build output (after `pnpm build:us`):
#   dist/
#     404.html, guides/foo.html, images/, static/, pagefind/, ...
#
# cleanUrls: true → /guides/foo serves /guides/foo.html

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Single locale served at root: cleanUrls + single 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache on HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
