# Słownik dokumentacji OVHcloud — polski.
#
# Tłumaczenie pliku en.yaml. Klucze muszą istnieć w en.yaml i nigdy nie są
# tłumaczone. Scalanie odbywa się pole po polu: wpis zawierający wyłącznie
# `definition:` zachowuje `aliases`, `abbreviation` i `relatedTerms` z wersji
# angielskiej. Pola te są tu podawane ponownie tylko wtedy, gdy faktycznie się
# różnią (formy spotykane w tekstach polskich).
#
# Odnośniki `/links/<klucz>` oraz `/guides/...` pozostają bez zmian: są
# rozwiązywane dla każdego języka podczas generowania.

# --- Produkty i usługi ------------------------------------------------------

additionalIp:
  definition: >-
    [Dodatkowy publiczny adres IP](/links/network/additional-ip), który możesz
    zamówić i przypisać do zgodnej usługi OVHcloud, a następnie w dowolnym
    momencie przenieść z jednej usługi na inną.
  aliases:
    - IP failover
    - dodatkowy adres IP

cdnInfrastructure:
  definition: >-
    [Sieć dostarczania treści](/links/network/cdn-infrastructure) OVHcloud:
    zapisuje w pamięci podręcznej zawartość Twojej strony WWW w punktach
    obecności na całym świecie, aby przyspieszyć jej wyświetlanie odwiedzającym.

dedicatedServer:
  definition: >-
    [Serwer fizyczny](/links/bare-metal/bare-metal) wynajmowany w całości: masz
    wyłączny dostęp do sprzętu oraz pełne uprawnienia administratora.
  aliases:
    - serwer dedykowany

emailPro:
  definition: >-
    [Oferta profesjonalnych adresów e-mail](/links/web/email-pro) OVHcloud:
    dedykowana skrzynka pocztowa dla każdego użytkownika, z dostępem przez
    webmail i synchronizacją na wszystkich urządzeniach.

hostedExchange:
  definition: >-
    [Hostowana usługa Microsoft Exchange](/links/web/emails-hosted-exchange)
    OVHcloud: poczta współdzielona ze wspólnymi kalendarzami, kontaktami i
    zadaniami, hostowana i zarządzana przez OVHcloud.
  aliases:
    - Exchange

loadBalancer:
  definition: >-
    Usługa OVHcloud, która [rozdziela ruch przychodzący](/links/network/load-balancer)
    pomiędzy kilka Twoich usług, zwiększając ich dostępność i wydajność.

managedWordpress:
  definition: >-
    [Oferta zarządzanego WordPressa](/links/web/hosting-wordpress) OVHcloud:
    OVHcloud zajmuje się instalacją, aktualizacjami i bezpieczeństwem Twojej
    strony WordPress, dzięki czemu możesz skupić się na jej treści.

mxPlan:
  definition: >-
    [Standardowe rozwiązanie pocztowe](/links/web/emails) OVHcloud, dołączone
    do nazw domen i hostingu: skrzynki pocztowe z dostępem przez webmail oraz
    ochroną przed spamem i wirusami.

ovhcloudApi:
  definition: >-
    Interfejs RESTful służący do programistycznego zarządzania usługami
    OVHcloud. Obejmuje wszystkie funkcje dostępne w Panelu klienta OVHcloud i
    więcej. Zobacz
    [Pierwsze kroki z API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhcloudConnect:
  definition: >-
    [Prywatne i bezpieczne połączenie](/links/network/ovhcloud-connect) między
    Twoją własną infrastrukturą (centrum danych, biura) a siecią OVHcloud.

ovhcloudControlPanel:
  definition: >-
    Interfejs internetowy służący do zarządzania wszystkimi produktami i
    usługami OVHcloud: zamawianiem, konfiguracją, płatnościami i użytkownikami.
    Zobacz
    [przewodnik po nawigacji](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - Panel klienta
    - Panel klienta OVHcloud

sslGateway:
  definition: >-
    Usługa OVHcloud, która [zabezpiecza Twoją stronę WWW](/links/web/ssl-gateway),
    szyfrując ruch między odwiedzającymi a Twoim serwerem za pomocą SSL/TLS,
    bez konieczności instalowania certyfikatu na samym serwerze.

vps:
  definition: >-
    [Virtual Private Server](/links/bare-metal/vps): maszyna wirtualna z
    gwarantowanymi zasobami i pełnym dostępem root, hostowana na
    infrastrukturze OVHcloud.
  aliases:
    - Virtual Private Server
    - wirtualny serwer prywatny

vrack:
  definition: >-
    [Sieć prywatna](/links/network/vrack) OVHcloud: łączy zgodne usługi
    OVHcloud w odizolowanej sieci, również pomiędzy różnymi centrami danych.

webCloudDatabases:
  definition: >-
    [Niezależna usługa baz danych](/links/web/databases) przeznaczona do
    projektów internetowych, zapewniająca dedykowane zasoby dla Twoich baz
    danych poza hostingiem.

webHosting:
  definition: >-
    [Usługa hostingu współdzielonego](/links/web/hosting) OVHcloud dla stron
    WWW: przestrzeń dyskowa, bazy danych i instalacja CMS jednym kliknięciem, na
    infrastrukturze zarządzanej przez OVHcloud.
  aliases:
    - hosting
    - hosting współdzielony

zimbra:
  definition: >-
    [Rozwiązanie poczty współdzielonej o otwartym kodzie](/links/web/zimbra)
    oferowane przez OVHcloud, łączące pocztę, kalendarze i kontakty w jednym
    interfejsie webmail.

# --- Pojęcia właściwe dla OVHcloud ------------------------------------------

anycastDns:
  definition: >-
    [Płatna opcja DNS](/links/web/domains-options-anycast), która replikuje
    Twoją strefę DNS na serwerach na całym świecie: zapytania DNS są dzięki
    temu obsługiwane z lokalizacji najbliższej odwiedzającemu.

automatedBackup:
  definition: >-
    Opcja VPS, która automatycznie tworzy
    [codzienną kopię zapasową](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    Twojego serwera, z kilkoma punktami przywracania do wyboru.
  aliases:
    - automatyczna kopia zapasowa

dnsZone:
  definition: >-
    Zbiór rekordów DNS (A, MX, CNAME itp.), które łączą
    [nazwę domeny](/links/web/domains) z jej usługami, takimi jak strona WWW
    czy poczta. Strefą zarządzasz z poziomu Panelu klienta OVHcloud.
  aliases:
    - strefa DNS

kvmConsole:
  definition: >-
    Konsola zdalna (Keyboard, Video, Mouse) dostępna w Panelu klienta OVHcloud
    dla serwerów VPS i serwerów dedykowanych: zapewnia dostęp do ekranu i
    klawiatury maszyny nawet wtedy, gdy nie jest ona osiągalna przez sieć.
  aliases:
    - konsola KVM

multisite:
  definition: >-
    [Funkcja hostingu](/links/web/hosting-multisite) pozwalająca hostować kilka
    stron WWW, każdą z własną domeną lub subdomeną, w ramach jednego hostingu.

ovhconfig:
  definition: >-
    Plik konfiguracyjny znajdujący się w katalogu głównym przestrzeni dyskowej
    Twojego hostingu, który określa środowisko uruchomieniowe strony WWW
    (wersja PHP, tryb produkcyjny lub deweloperski, firewall aplikacyjny).

snapshot:
  definition: >-
    Ręcznie wykonany obraz serwera VPS z danego momentu, który możesz
    [przywrócić w dowolnej chwili](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps).
    Zwykle tworzy się go przed ryzykowną operacją.
