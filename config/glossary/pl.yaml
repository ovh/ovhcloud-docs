# Słownik dokumentacji OVHcloud — polski.
#
# Tłumaczenie pliku en.yaml. Klucze muszą istnieć w en.yaml i nigdy nie są
# tłumaczone. Scalanie odbywa się pole po polu: wpis zawierający wyłącznie
# `definition:` zachowuje `aliases`, `abbreviation` i `relatedTerms` z wersji
# angielskiej. Pola te są tu deklarowane ponownie tylko wtedy, gdy faktycznie
# się różnią (formy spotykane w polskich tekstach).
#
# Akronimy techniczne (TTL, SPF, DKIM, DMARC, IMAP, POP, SMTP, SFTP, DNSSEC)
# nie są tłumaczone: pozostają w niezmienionej postaci, zgodnie z praktyką
# stosowaną w polskich przewodnikach.
#
# Linki `/links/<klucz>` oraz `/guides/...` są przenoszone bez zmian: są one
# rozwiązywane osobno dla każdej wersji językowej podczas generowania.

# --- Pojęcia właściwe dla OVHcloud ------------------------------------------

anycastDns:
  definition: >-
    [Płatna opcja DNS](/links/web/domains-options-anycast), która replikuje
    Twoją strefę DNS na serwerach rozmieszczonych na całym świecie. Zapytania
    DNS są dzięki temu obsługiwane z lokalizacji najbliższej odwiedzającemu.

automatedBackup:
  definition: >-
    Opcja VPS, która automatycznie tworzy
    [codzienną kopię zapasową](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    Twojego serwera, z kilkoma punktami przywracania do wyboru.
  aliases:
    - automatyczna kopia zapasowa

kvmConsole:
  definition: >-
    Zdalna konsola (Keyboard, Video, Mouse) dostępna dla VPS oraz serwerów
    dedykowanych w Panelu klienta OVHcloud: daje ona dostęp do ekranu i
    klawiatury maszyny nawet wtedy, gdy nie jest ona osiągalna przez sieć.
  aliases:
    - konsola KVM

multisite:
  definition: >-
    [Funkcja hostingu](/links/web/hosting-multisite), która pozwala
    utrzymywać wiele stron internetowych, każdą z własną domeną lub subdomeną,
    w ramach jednego hostingu.

mxPlan:
  definition: >-
    Standardowe [rozwiązanie e-mail](/links/web/emails) OVHcloud, dołączane do
    nazw domen i pakietów hostingowych: konta e-mail z dostępem przez webmail
    oraz ochroną przed spamem i wirusami.

ovhcloudApi:
  definition: >-
    Interfejs RESTful służący do programistycznego zarządzania usługami
    OVHcloud. Obejmuje wszystko, co jest dostępne w Panelu klienta, i więcej.
    Zobacz przewodnik
    [Pierwsze kroki z API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    Plik konfiguracyjny umieszczony w katalogu głównym przestrzeni dyskowej
    Twojego hostingu, który określa środowisko uruchomieniowe strony (wersja
    PHP, tryb produkcyjny lub deweloperski, firewall).

snapshot:
  definition: >-
    Ręcznie wykonany obraz VPS z określonego momentu, który możesz
    [przywrócić w dowolnej chwili](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps).
    Zwykle tworzy się go przed ryzykowną zmianą.

vrack:
  definition: >-
    [Sieć prywatna](/links/network/vrack) OVHcloud: łączy ze sobą kwalifikujące
    się usługi OVHcloud w ramach odizolowanej sieci, również pomiędzy różnymi
    centrami danych.

zimbra:
  definition: >-
    [Rozwiązanie do pracy grupowej i komunikacji o otwartym kodzie
    źródłowym](/links/web/zimbra) oferowane przez OVHcloud, które łączy pocztę
    e-mail, kalendarze i kontakty w jednym interfejsie webmail.

# --- DNS i nazwy domen ------------------------------------------------------

aRecord:
  definition: >-
    Rekord DNS, który wskazuje adres IPv4 dla nazwy domeny — czyli ten, który
    kieruje odwiedzających na serwer hostujący Twoją stronę. Jego
    odpowiednikiem dla IPv6 jest rekord AAAA.
  aliases:
    - A record
    - AAAA record
    - rekord A
    - rekord AAAA

cname:
  definition: >-
    Rekord DNS, który czyni jedną nazwę aliasem innej: podąża wówczas za tym,
    na co wskazuje jego cel. Jest często stosowany dla subdomen, takich jak
    `www`.
  aliases:
    - CNAME
    - CNAME record
    - rekord CNAME

dnsPropagation:
  definition: >-
    Czas potrzebny na to, aby zmiana w DNS była widoczna wszędzie. Serwery na
    całym świecie przechowują poprzednie wartości w pamięci podręcznej do
    momentu wygaśnięcia **TTL** rekordu, co może potrwać nawet 24 godziny.
  aliases:
    - propagation
    - propagacja
    - propagacja DNS

dnsZone:
  definition: >-
    Zbiór rekordów DNS (A, MX, CNAME itd.), które łączą
    [nazwę domeny](/links/web/domains) z jej usługami, takimi jak strona
    internetowa czy poczta. Strefą DNS zarządzasz z poziomu Panelu klienta
    OVHcloud.
  aliases:
    - DNS zone
    - strefa DNS

dnssec:
  definition: >-
    Rozszerzenie bezpieczeństwa DNS, które podpisuje rekordy Twojej strefy.
    Dzięki temu resolwer może zweryfikować, że otrzymana odpowiedź faktycznie
    pochodzi z Twojej domeny i nie została zmodyfikowana.

glueRecord:
  definition: >-
    Rekord DNS podający adres IP serwera nazw, którego własna nazwa należy do
    obsługiwanej przez niego domeny. Przerywa on pętlę zapytań, która w innym
    przypadku uniemożliwiłaby rozwiązanie domeny.
  aliases:
    - glue record
    - rekord glue

mxRecord:
  definition: >-
    Rekord DNS wskazujący serwery poczty odbierające wiadomości e-mail dla
    domeny. Jego wartość priorytetu decyduje o tym, który serwer jest
    odpytywany jako pierwszy.
  aliases:
    - MX record
    - rekord MX

ttl:
  definition: >-
    *Time To Live* — czas w sekundach, przez jaki serwery mogą przechowywać
    rekord DNS w pamięci podręcznej przed jego ponownym sprawdzeniem. Niższy
    TTL przyspiesza propagację zmian, wyższy ogranicza liczbę zapytań.

wildcard:
  definition: >-
    Wpis wykorzystujący `*`, aby objąć naraz wszystkie nazwy na danym poziomie:
    rekord DNS typu wildcard obejmuje wszystkie niezadeklarowane subdomeny, a
    certyfikat SSL typu wildcard zabezpiecza je wszystkie.
  aliases:
    - wildcard record
    - rekord wildcard

# --- Poczta elektroniczna ---------------------------------------------------

catchAll:
  definition: >-
    Konto e-mail, które odbiera wszystkie wiadomości wysłane na nieistniejący
    adres w Twojej domenie, zamiast pozwolić na ich odrzucenie.
  aliases:
    - catch-all

dkim:
  definition: >-
    Standard poczty elektronicznej, który dodaje podpis kryptograficzny do
    Twoich wiadomości wychodzących. Serwer odbiorcy może dzięki temu
    zweryfikować, że pochodzą one z Twojej domeny i nie zostały zmienione po
    drodze.

dmarc:
  definition: >-
    Standard poczty elektronicznej oparty na **SPF** i **DKIM**: wskazuje
    serwerom odbiorczym, jak postępować z wiadomościami, które nie przejdą tych
    weryfikacji, oraz dokąd wysyłać raporty.

imap:
  definition: >-
    Protokół poczty elektronicznej, który przechowuje wiadomości na serwerze i
    synchronizuje je na wszystkich urządzeniach. W odróżnieniu od **POP**
    odczytanie lub usunięcie wiadomości na jednym urządzeniu jest widoczne
    wszędzie.

pop:
  definition: >-
    Protokół poczty elektronicznej, który pobiera wiadomości na jedno
    urządzenie, zwykle usuwając je z serwera. Wybierz **IMAP**, jeśli
    korzystasz z poczty na kilku urządzeniach.

smtp:
  definition: >-
    Protokół służący do *wysyłania* wiadomości e-mail. Twój program pocztowy
    łączy się z serwerem SMTP, aby przekazać wiadomość, natomiast **IMAP** i
    **POP** służą do jej odczytu.

spf:
  definition: >-
    Rekord DNS zawierający listę serwerów uprawnionych do wysyłania wiadomości
    e-mail w imieniu Twojej domeny, dzięki czemu serwery odbiorcze mogą
    odrzucać wiadomości podszywające się pod Twój adres.

# --- Hosting, pliki i narzędzia ---------------------------------------------

cron:
  definition: >-
    Zadanie zaplanowane, które automatycznie uruchamia skrypt o określonej
    godzinie lub w określonych odstępach czasu — na przykład nocne zadanie
    konserwacyjne na Twojej stronie internetowej.
  aliases:
    - cron job
    - cron task
    - zadanie cron
    - zadanie zaplanowane

htaccess:
  definition: >-
    Plik konfiguracyjny umieszczany w katalogu strony internetowej w celu
    kontrolowania zachowania serwera WWW dla tego folderu: przekierowania,
    ograniczenia dostępu, ochrona hasłem i strony błędów.
  aliases:
    - .htaccess

phpmyadmin:
  definition: >-
    Interfejs webowy do administrowania bazą danych MySQL lub MariaDB:
    przeglądanie tabel, wykonywanie zapytań oraz import i eksport bazy — bez
    korzystania z wiersza poleceń.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    Protokół przesyłania plików działający w ramach połączenia SSH, dzięki
    czemu dane uwierzytelniające i przesyłane dane są szyfrowane. Należy go
    preferować względem zwykłego **FTP**, który przesyła wszystko otwartym
    tekstem.
