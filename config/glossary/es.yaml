# Glosario de la documentación de OVHcloud — español.
#
# Traducción de en.yaml (a partir de la versión francesa, según las reglas de
# traducción). Las claves deben existir en en.yaml y nunca se traducen. La
# fusión se realiza campo por campo: una entrada que solo incluye
# `definition:` conserva `aliases`, `abbreviation` y `relatedTerms` del inglés.
# Aquí solo se vuelven a declarar cuando realmente difieren (formas utilizadas
# en los textos en español).
#
# Los enlaces `/links/<clave>` y `/guides/...` se mantienen tal cual: se
# resuelven por idioma durante la generación.

# --- Productos y servicios --------------------------------------------------

additionalIp:
  definition: >-
    Una [dirección IP pública adicional](/links/network/additional-ip) que puede
    contratar y asociar a un servicio de OVHcloud compatible, y transferir de un
    servicio a otro en cualquier momento.
  aliases:
    - IP de failover
    - IP adicional

cdnInfrastructure:
  definition: >-
    La [red de distribución de contenidos](/links/network/cdn-infrastructure) de
    OVHcloud: almacena en caché el contenido de su sitio web en puntos de
    presencia de todo el mundo para acelerar su entrega a los visitantes.

dedicatedServer:
  definition: >-
    Un [servidor físico](/links/bare-metal/bare-metal) alquilado en su
    totalidad: dispone de un uso exclusivo del hardware, con acceso
    administrativo completo.
  aliases:
    - servidor dedicado

emailPro:
  definition: >-
    La [oferta de correo electrónico profesional](/links/web/email-pro) de
    OVHcloud: una cuenta de correo dedicada por usuario, con acceso por webmail
    y sincronización en todos sus dispositivos.

hostedExchange:
  definition: >-
    El [servicio Microsoft Exchange alojado](/links/web/emails-hosted-exchange)
    de OVHcloud: correo colaborativo con calendarios, contactos y tareas
    compartidos, alojado y gestionado por OVHcloud.
  aliases:
    - Exchange

loadBalancer:
  definition: >-
    Un servicio de OVHcloud que [distribuye el tráfico entrante](/links/network/load-balancer)
    entre varios de sus servicios, para mejorar su disponibilidad y su
    rendimiento.

managedWordpress:
  definition: >-
    La [oferta de WordPress gestionado](/links/web/hosting-wordpress) de
    OVHcloud: OVHcloud se encarga de la instalación, las actualizaciones y la
    seguridad de su sitio WordPress, para que pueda centrarse en su contenido.

mxPlan:
  definition: >-
    La [solución de correo estándar](/links/web/emails) de OVHcloud, incluida
    con los nombres de dominio y los alojamientos web: cuentas de correo con
    acceso por webmail y protección contra spam y virus.

ovhcloudApi:
  definition: >-
    La interfaz RESTful que permite gestionar sus servicios de OVHcloud de forma
    programática. Abarca todo lo disponible en el área de cliente de OVHcloud, y
    más. Consulte
    [Primeros pasos con la API de OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhcloudConnect:
  definition: >-
    Una [conexión privada y segura](/links/network/ovhcloud-connect) entre su
    propia infraestructura (centro de datos, oficinas) y la red de OVHcloud.

ovhcloudControlPanel:
  definition: >-
    La interfaz web que permite gestionar todos sus productos y servicios de
    OVHcloud: pedidos, configuración, facturación y gestión de usuarios.
    Consulte la
    [guía de navegación](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - área de cliente
    - área de cliente de OVHcloud

sslGateway:
  definition: >-
    Un servicio de OVHcloud que [protege su sitio web](/links/web/ssl-gateway)
    cifrando el tráfico entre los visitantes y su servidor mediante SSL/TLS, sin
    necesidad de instalar un certificado en el propio servidor.

vps:
  definition: >-
    Un [Virtual Private Server](/links/bare-metal/vps): una máquina virtual con
    recursos garantizados y acceso root completo, alojada en la infraestructura
    de OVHcloud.
  aliases:
    - Virtual Private Server
    - servidor privado virtual

vrack:
  definition: >-
    La [red privada](/links/network/vrack) de OVHcloud: conecta entre sí sus
    servicios de OVHcloud compatibles en una red aislada, incluso entre distintos
    centros de datos.

webCloudDatabases:
  definition: >-
    Un [servicio de bases de datos independiente](/links/web/databases) para
    proyectos web, que proporciona recursos dedicados a sus bases de datos fuera
    de su alojamiento.

webHosting:
  definition: >-
    El [servicio de alojamiento compartido](/links/web/hosting) de OVHcloud para
    sus sitios web: almacenamiento, bases de datos e instalación de CMS con un
    solo clic, en una infraestructura gestionada por OVHcloud.
  aliases:
    - alojamiento web
    - alojamiento compartido

zimbra:
  definition: >-
    Una [solución de mensajería colaborativa de código abierto](/links/web/zimbra)
    ofrecida por OVHcloud, que reúne correo, calendarios y contactos en una
    misma interfaz de webmail.

# --- Conceptos propios de OVHcloud ------------------------------------------

anycastDns:
  definition: >-
    Una [opción DNS de pago](/links/web/domains-options-anycast) que replica su
    zona DNS en servidores de todo el mundo: así, las consultas DNS se responden
    desde la ubicación más cercana al visitante.

automatedBackup:
  definition: >-
    Una opción de los VPS que crea automáticamente una
    [copia de seguridad diaria](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    de su servidor, con varios puntos de restauración a elegir.
  aliases:
    - copia de seguridad automatizada

dnsZone:
  definition: >-
    El conjunto de registros DNS (A, MX, CNAME, etc.) que conectan un
    [nombre de dominio](/links/web/domains) con sus servicios, como un sitio web
    o el correo. La zona DNS se gestiona desde el área de cliente de OVHcloud.
  aliases:
    - zona DNS

kvmConsole:
  definition: >-
    Una consola remota (Keyboard, Video, Mouse) disponible para los VPS y los
    servidores dedicados en el área de cliente de OVHcloud: le da acceso a la
    pantalla y al teclado de la máquina, incluso cuando esta ya no es accesible
    a través de la red.
  aliases:
    - consola KVM

multisite:
  definition: >-
    Una [funcionalidad de los alojamientos web](/links/web/hosting-multisite)
    que permite alojar varios sitios web, cada uno con su propio dominio o
    subdominio, en un mismo alojamiento.

ovhconfig:
  definition: >-
    Un archivo de configuración situado en la raíz del espacio de almacenamiento
    de su alojamiento web, que determina el entorno de ejecución de su sitio
    (versión de PHP, modo de producción o de desarrollo, firewall de
    aplicaciones).

snapshot:
  definition: >-
    Una imagen manual de un VPS en un momento dado, que puede
    [restaurar en cualquier momento](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps).
    Suele realizarse antes de una operación de riesgo.
