# Glosario de la documentación de OVHcloud — español.
#
# Traducción de en.yaml. Las claves deben existir en en.yaml: nunca se
# traducen. La fusión se realiza campo por campo, por lo que una entrada que
# solo aporta `definition:` conserva los `aliases`, `abbreviation` y
# `relatedTerms` del inglés; solo se vuelven a declarar aquí cuando difieren
# realmente (formas presentes en los textos en español).
#
# Los acrónimos técnicos (TTL, SPF, DKIM, DMARC, IMAP, POP, SMTP, SFTP,
# DNSSEC) no se traducen: se mantienen tal cual, conforme al uso de las guías
# en español.
#
# Los enlaces `/links/<clave>` y `/guides/...` se conservan tal cual: se
# resuelven por idioma durante la generación.

# --- Nociones propias de OVHcloud -------------------------------------------

anycastDns:
  definition: >-
    Una [opción DNS de pago](/links/web/domains-options-anycast) que replica
    su zona DNS en servidores repartidos por todo el mundo: así, las consultas
    DNS se responden desde la ubicación más cercana al visitante.

automatedBackup:
  definition: >-
    Una opción de los VPS que crea automáticamente una
    [copia de seguridad diaria](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    de su servidor, con varios puntos de restauración a elegir.
  aliases:
    - copia de seguridad automatizada

kvmConsole:
  definition: >-
    Una consola remota (Keyboard, Video, Mouse) disponible para los VPS y los
    servidores dedicados en el área de cliente de OVHcloud: proporciona acceso
    a la pantalla y al teclado de la máquina, incluso cuando esta ya no es
    accesible por la red.
  aliases:
    - consola KVM

multisite:
  definition: >-
    Una [funcionalidad de los alojamientos web](/links/web/hosting-multisite)
    que permite alojar varios sitios web, cada uno con su propio dominio o
    subdominio, en un mismo alojamiento.

mxPlan:
  definition: >-
    La [solución de correo electrónico estándar](/links/web/emails) de
    OVHcloud, incluida con los nombres de dominio y los alojamientos web:
    direcciones de correo con acceso webmail y protección contra spam y virus.

ovhcloudApi:
  definition: >-
    La interfaz RESTful que permite gestionar sus servicios de OVHcloud de
    forma programática. Cubre todo lo que está disponible en el área de cliente
    de OVHcloud, y más. Consulte la guía
    [Primeros pasos con las API de OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    Un fichero de configuración situado en la raíz del espacio de
    almacenamiento de su alojamiento web, que determina el entorno de
    ejecución de su sitio (versión de PHP, modo producción o desarrollo,
    cortafuegos aplicativo).

snapshot:
  definition: >-
    Una imagen manual de un VPS en un momento dado, que puede
    [restaurar en cualquier momento](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    generalmente realizada antes de una operación de riesgo.

vrack:
  definition: >-
    La [red privada](/links/network/vrack) de OVHcloud: conecta entre sí sus
    servicios de OVHcloud elegibles dentro de una red aislada, incluso entre
    distintos centros de datos.

zimbra:
  definition: >-
    Una [solución de mensajería colaborativa de código abierto](/links/web/zimbra)
    ofrecida por OVHcloud, que reúne correo electrónico, calendarios y
    contactos en una misma interfaz de webmail.

# --- DNS y nombres de dominio -----------------------------------------------

aRecord:
  definition: >-
    El registro DNS que asocia un nombre de dominio a una dirección IPv4, es
    decir, el que dirige a sus visitantes al servidor que aloja su sitio web.
    Su equivalente en IPv6 es el registro AAAA.
  aliases:
    - registro A
    - registro AAAA

cname:
  definition: >-
    Un registro DNS que convierte un nombre en alias de otro: sigue entonces
    aquello a lo que apunta su destino. Se utiliza a menudo para los
    subdominios, como `www`.
  aliases:
    - CNAME
    - registro CNAME

dnsPropagation:
  definition: >-
    El tiempo necesario para que una modificación DNS sea visible en todas
    partes. Los servidores de todo el mundo conservan los valores anteriores
    en caché hasta que expira el **TTL** del registro, lo que puede tardar
    hasta 24 horas.
  aliases:
    - propagación
    - propagación DNS

dnsZone:
  definition: >-
    El conjunto de registros DNS (A, MX, CNAME, etc.) que conectan un
    [nombre de dominio](/links/web/domains) con sus servicios, como un sitio
    web o un servicio de correo. La zona DNS se gestiona desde el área de
    cliente de OVHcloud.
  aliases:
    - zona DNS

dnssec:
  definition: >-
    Una extensión de seguridad del DNS que firma los registros de su zona: así,
    un resolutor puede comprobar que la respuesta recibida procede realmente de
    su dominio y no ha sido alterada.

glueRecord:
  definition: >-
    Un registro DNS que proporciona la dirección IP de un servidor DNS cuyo
    nombre pertenece al dominio al que da servicio. De este modo evita el bucle
    de resolución que dejaría el dominio inaccesible.
  aliases:
    - glue record

mxRecord:
  definition: >-
    El registro DNS que designa los servidores de correo que reciben los
    mensajes de un dominio. Su valor de prioridad determina qué servidor se
    consulta primero.
  aliases:
    - registro MX

ttl:
  definition: >-
    *Time To Live*: el tiempo, en segundos, durante el cual los servidores
    pueden conservar un registro DNS en caché antes de volver a comprobarlo.
    Un TTL bajo acelera la propagación de los cambios; un TTL alto reduce el
    número de consultas.

wildcard:
  definition: >-
    Una entrada que utiliza `*` para cubrir de una vez todos los nombres de un
    mismo nivel: un registro DNS wildcard cubre todos los subdominios no
    declarados, y un certificado SSL wildcard los protege todos.
  aliases:
    - registro wildcard

# --- Correo electrónico -----------------------------------------------------

catchAll:
  definition: >-
    Una dirección de correo electrónico que recibe todos los mensajes enviados
    a una dirección inexistente de su dominio, en lugar de dejar que sean
    rechazados.
  aliases:
    - catch-all

dkim:
  definition: >-
    Un estándar de correo electrónico que añade una firma criptográfica a sus
    mensajes salientes: así, el servidor destinatario puede comprobar que
    proceden realmente de su dominio y que no han sido modificados por el
    camino.

dmarc:
  definition: >-
    Un estándar de correo electrónico que se apoya en **SPF** y **DKIM**:
    indica a los servidores destinatarios qué tratamiento aplicar a los
    mensajes que no superan esas comprobaciones, y la dirección a la que enviar
    los informes.

imap:
  definition: >-
    Un protocolo de correo electrónico que conserva sus mensajes en el servidor
    y los sincroniza en todos sus dispositivos. A diferencia de **POP**, leer o
    eliminar un mensaje en un dispositivo se refleja en todas partes.

pop:
  definition: >-
    Un protocolo de correo electrónico que descarga los mensajes en un único
    dispositivo, eliminándolos generalmente del servidor. Utilice preferiblemente
    **IMAP** si consulta su correo desde varios dispositivos.

smtp:
  definition: >-
    El protocolo utilizado para *enviar* correos electrónicos. Su programa de
    correo se conecta a un servidor SMTP para transmitir un mensaje, mientras
    que **IMAP** y **POP** sirven para consultarlos.

spf:
  definition: >-
    Un registro DNS que enumera los servidores autorizados a enviar correos
    electrónicos para su dominio, para que los servidores destinatarios puedan
    rechazar los mensajes que suplantan su dirección.

# --- Alojamiento, ficheros y herramientas -----------------------------------

cron:
  definition: >-
    Una tarea programada que ejecuta automáticamente un script a una hora o con
    una periodicidad definida; por ejemplo, una operación de mantenimiento
    nocturna en su sitio web.
  aliases:
    - tarea cron
    - tarea programada

htaccess:
  definition: >-
    Un fichero de configuración colocado en un directorio de su sitio web para
    controlar el comportamiento del servidor web en esa carpeta: redirecciones,
    restricciones de acceso, protección por contraseña y páginas de error.
  aliases:
    - .htaccess

phpmyadmin:
  definition: >-
    Una interfaz web que permite administrar una base de datos MySQL o MariaDB:
    consulta de las tablas, ejecución de consultas, importación y exportación
    de la base, sin pasar por la línea de comandos.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    Un protocolo de transferencia de ficheros que funciona dentro de una
    conexión SSH: las credenciales y los datos viajan cifrados. Es preferible
    al **FTP** clásico, que lo transmite todo en claro.
