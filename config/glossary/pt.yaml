# Glossário da documentação OVHcloud — português.
#
# Tradução de en.yaml. As chaves têm de existir em en.yaml: nunca são
# traduzidas. A fusão faz-se campo a campo, pelo que uma entrada que apenas
# fornece `definition:` conserva os `aliases`, `abbreviation` e `relatedTerms`
# do inglês — estes só são redeclarados aqui quando diferem realmente (formas
# encontradas nos textos em português).
#
# Os acrónimos técnicos (TTL, SPF, DKIM, DMARC, IMAP, POP, SMTP, SFTP, DNSSEC)
# não se traduzem: mantêm-se tal como estão, em conformidade com a utilização
# nos guias em português.
#
# As ligações `/links/<chave>` e `/guides/...` são mantidas tal como estão:
# são resolvidas por idioma durante a geração.

# --- Noções próprias da OVHcloud --------------------------------------------

anycastDns:
  definition: >-
    Uma [opção DNS paga](/links/web/domains-options-anycast) que replica a sua
    zona DNS em servidores distribuídos por todo o mundo: os pedidos DNS são
    assim tratados a partir do local mais próximo do visitante.

automatedBackup:
  definition: >-
    Uma opção dos VPS que cria automaticamente uma
    [cópia de segurança diária](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    do seu servidor, com vários pontos de restauro à escolha.
  aliases:
    - cópia de segurança automatizada

kvmConsole:
  definition: >-
    Uma consola remota (Keyboard, Video, Mouse) disponível para os VPS e os
    servidores dedicados na Área de Cliente OVHcloud: dá acesso ao ecrã e ao
    teclado da máquina, mesmo quando esta já não está acessível através da
    rede.
  aliases:
    - consola KVM

multisite:
  definition: >-
    Uma [funcionalidade dos alojamentos web](/links/web/hosting-multisite) que
    permite alojar vários sites web, cada um com o seu próprio domínio ou
    subdomínio, num mesmo alojamento.

mxPlan:
  definition: >-
    A [solução de e-mail padrão](/links/web/emails) da OVHcloud, incluída com
    os nomes de domínio e os alojamentos web: endereços de e-mail com acesso
    webmail e proteção contra spam e vírus.

ovhcloudApi:
  definition: >-
    A interface RESTful que permite gerir os seus serviços OVHcloud por
    programação. Abrange tudo o que está disponível na Área de Cliente
    OVHcloud, e mais ainda. Consulte o guia
    [Primeiros passos com as API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    Um ficheiro de configuração situado na raiz do espaço de armazenamento do
    seu alojamento web, que determina o ambiente de execução do seu site
    (versão do PHP, modo de produção ou de desenvolvimento, firewall
    aplicacional).

snapshot:
  definition: >-
    Uma imagem manual de um VPS num dado momento, que pode
    [restaurar a qualquer momento](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    geralmente criada antes de uma operação de risco.

vrack:
  definition: >-
    A [rede privada](/links/network/vrack) da OVHcloud: liga entre si os seus
    serviços OVHcloud elegíveis numa rede isolada, inclusive entre datacenters
    diferentes.

zimbra:
  definition: >-
    Uma [solução de mensagens colaborativas open source](/links/web/zimbra)
    proposta pela OVHcloud, que reúne e-mails, calendários e contactos numa
    mesma interface de webmail.

# --- DNS e nomes de domínio -------------------------------------------------

aRecord:
  definition: >-
    O registo DNS que associa um nome de domínio a um endereço IPv4, ou seja,
    aquele que encaminha os seus visitantes para o servidor que aloja o seu
    site web. O seu equivalente em IPv6 é o registo AAAA.
  aliases:
    - registo A
    - registo AAAA

cname:
  definition: >-
    Um registo DNS que torna um nome no alias de outro: segue então aquilo para
    onde aponta o seu destino. É frequentemente utilizado para os subdomínios,
    como `www`.
  aliases:
    - CNAME
    - registo CNAME

dnsPropagation:
  definition: >-
    O tempo necessário para que uma alteração DNS fique visível em todo o lado.
    Os servidores de todo o mundo conservam os valores anteriores em cache até
    à expiração do **TTL** do registo, o que pode demorar até 24 horas.
  aliases:
    - propagação
    - propagação DNS

dnsZone:
  definition: >-
    O conjunto dos registos DNS (A, MX, CNAME, etc.) que ligam um
    [nome de domínio](/links/web/domains) aos seus serviços, como um site web
    ou um serviço de e-mail. A zona DNS é gerida a partir da Área de Cliente
    OVHcloud.
  aliases:
    - zona DNS

dnssec:
  definition: >-
    Uma extensão de segurança do DNS que assina os registos da sua zona: um
    resolvedor pode assim verificar que a resposta recebida provém realmente do
    seu domínio e não foi alterada.

glueRecord:
  definition: >-
    Um registo DNS que fornece o endereço IP de um servidor DNS cujo nome
    pertence ao domínio que serve. Evita assim o ciclo de resolução que
    tornaria o domínio inacessível.
  aliases:
    - glue record

mxRecord:
  definition: >-
    O registo DNS que designa os servidores de e-mail que recebem as mensagens
    de um domínio. O seu valor de prioridade determina qual o servidor
    contactado em primeiro lugar.
  aliases:
    - registo MX

ttl:
  definition: >-
    *Time To Live*: o tempo, em segundos, durante o qual os servidores podem
    conservar um registo DNS em cache antes de o verificarem novamente. Um TTL
    baixo acelera a propagação das alterações, um TTL elevado reduz o número de
    pedidos.

wildcard:
  definition: >-
    Uma entrada que utiliza `*` para abranger de uma só vez todos os nomes de
    um mesmo nível: um registo DNS wildcard abrange todos os subdomínios não
    declarados e um certificado SSL wildcard protege-os a todos.
  aliases:
    - registo wildcard

# --- Correio eletrónico -----------------------------------------------------

catchAll:
  definition: >-
    Um endereço de e-mail que recebe todas as mensagens enviadas para um
    endereço inexistente do seu domínio, em vez de as deixar ser rejeitadas.
  aliases:
    - catch-all

dkim:
  definition: >-
    Uma norma de correio eletrónico que acrescenta uma assinatura criptográfica
    aos seus e-mails enviados: o servidor destinatário pode assim verificar que
    provêm realmente do seu domínio e que não foram modificados pelo caminho.

dmarc:
  definition: >-
    Uma norma de correio eletrónico que se apoia no **SPF** e no **DKIM**:
    indica aos servidores destinatários o tratamento a aplicar às mensagens que
    falham estas verificações e o endereço para onde enviar os relatórios.

imap:
  definition: >-
    Um protocolo de correio eletrónico que conserva as suas mensagens no
    servidor e as sincroniza em todos os seus dispositivos. Ao contrário do
    **POP**, ler ou eliminar uma mensagem num dispositivo repercute-se em todo
    o lado.

pop:
  definition: >-
    Um protocolo de correio eletrónico que descarrega as mensagens para um
    único dispositivo, eliminando-as geralmente do servidor. Prefira o **IMAP**
    se consultar os seus e-mails a partir de vários dispositivos.

smtp:
  definition: >-
    O protocolo utilizado para *enviar* e-mails. O seu programa de correio liga-se
    a um servidor SMTP para transmitir uma mensagem, enquanto o **IMAP** e o
    **POP** servem para os consultar.

spf:
  definition: >-
    Um registo DNS que enumera os servidores autorizados a enviar e-mails para
    o seu domínio, para que os servidores destinatários possam rejeitar as
    mensagens que usurpam o seu endereço.

# --- Alojamento, ficheiros e ferramentas ------------------------------------

cron:
  definition: >-
    Uma tarefa agendada que executa automaticamente um script a uma hora ou
    segundo uma periodicidade definida — por exemplo, uma operação de
    manutenção noturna no seu site web.
  aliases:
    - tarefa cron
    - tarefa agendada

htaccess:
  definition: >-
    Um ficheiro de configuração colocado num diretório do seu site web para
    controlar o comportamento do servidor web nessa pasta: redirecionamentos,
    restrições de acesso, proteção por palavra-passe e páginas de erro.
  aliases:
    - .htaccess

phpmyadmin:
  definition: >-
    Uma interface web que permite administrar uma base de dados MySQL ou
    MariaDB: consulta das tabelas, execução de consultas, importação e
    exportação da base de dados — sem passar pela linha de comandos.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    Um protocolo de transferência de ficheiros que funciona no âmbito de uma
    ligação SSH: as credenciais e os dados são cifrados. É preferível ao **FTP**
    clássico, que transmite tudo em texto simples.
