# Glossário da documentação OVHcloud — português (pt-PT).
#
# Tradução de en.yaml (a partir da versão francesa, segundo as regras de
# tradução). As chaves têm de existir em en.yaml e nunca são traduzidas. A
# fusão é feita campo a campo: uma entrada que fornece apenas `definition:`
# conserva `aliases`, `abbreviation` e `relatedTerms` da versão inglesa. Aqui
# só são novamente declarados quando diferem realmente (formas utilizadas nos
# textos em português).
#
# Os links `/links/<chave>` e `/guides/...` são mantidos tal como estão: são
# resolvidos por idioma durante a geração.

# --- Produtos e serviços ----------------------------------------------------

additionalIp:
  definition: >-
    Um [endereço IP público adicional](/links/network/additional-ip) que pode
    encomendar e associar a um serviço OVHcloud compatível, e transferir de um
    serviço para outro em qualquer momento.
  aliases:
    - IP failover
    - IP adicional

cdnInfrastructure:
  definition: >-
    A [rede de distribuição de conteúdos](/links/network/cdn-infrastructure) da
    OVHcloud: coloca em cache o conteúdo do seu site nos pontos de presença
    espalhados pelo mundo, para acelerar a sua entrega aos visitantes.

dedicatedServer:
  definition: >-
    Um [servidor físico](/links/bare-metal/bare-metal) alugado na sua
    totalidade: dispõe de uma utilização exclusiva do hardware, com acesso
    administrativo completo.
  aliases:
    - servidor dedicado

emailPro:
  definition: >-
    A [oferta de emails profissionais](/links/web/email-pro) da OVHcloud: uma
    conta de email dedicada por utilizador, com acesso por webmail e
    sincronização em todos os seus dispositivos.

hostedExchange:
  definition: >-
    O [serviço Microsoft Exchange alojado](/links/web/emails-hosted-exchange) da
    OVHcloud: correio colaborativo com calendários, contactos e tarefas
    partilhados, alojado e gerido pela OVHcloud.
  aliases:
    - Exchange

loadBalancer:
  definition: >-
    Um serviço OVHcloud que [distribui o tráfego de entrada](/links/network/load-balancer)
    por vários dos seus serviços, para melhorar a respetiva disponibilidade e
    desempenho.

managedWordpress:
  definition: >-
    A [oferta WordPress gerida](/links/web/hosting-wordpress) da OVHcloud: a
    OVHcloud encarrega-se da instalação, das atualizações e da segurança do seu
    site WordPress, para que se possa dedicar aos conteúdos.

mxPlan:
  definition: >-
    A [solução de email padrão](/links/web/emails) da OVHcloud, incluída com os
    nomes de domínio e os alojamentos web: contas de email com acesso por
    webmail e proteção contra spam e vírus.

ovhcloudApi:
  definition: >-
    A interface RESTful que permite gerir os seus serviços OVHcloud por
    programação. Abrange tudo o que está disponível na área de cliente OVHcloud,
    e mais. Consulte
    [Primeiros passos com as APIs OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhcloudConnect:
  definition: >-
    Uma [ligação privada e segura](/links/network/ovhcloud-connect) entre a sua
    própria infraestrutura (datacenter, escritórios) e a rede OVHcloud.

ovhcloudControlPanel:
  definition: >-
    A interface web que permite gerir todos os seus produtos e serviços
    OVHcloud: encomendas, configuração, faturação e gestão de utilizadores.
    Consulte o
    [guia de navegação](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - área de cliente
    - Área de Cliente OVHcloud

sslGateway:
  definition: >-
    Um serviço OVHcloud que [protege o seu site](/links/web/ssl-gateway),
    cifrando o tráfego entre os visitantes e o seu servidor através de SSL/TLS,
    sem ter de instalar um certificado no próprio servidor.

vps:
  definition: >-
    Um [Virtual Private Server](/links/bare-metal/vps): uma máquina virtual com
    recursos garantidos e acesso root completo, alojada na infraestrutura da
    OVHcloud.
  aliases:
    - Virtual Private Server
    - servidor privado virtual

vrack:
  definition: >-
    A [rede privada](/links/network/vrack) da OVHcloud: liga entre si os seus
    serviços OVHcloud compatíveis numa rede isolada, mesmo entre datacenters
    diferentes.

webCloudDatabases:
  definition: >-
    Um [serviço de bases de dados autónomo](/links/web/databases) destinado a
    projetos web, que fornece recursos dedicados às suas bases de dados fora do
    seu alojamento.

webHosting:
  definition: >-
    O [serviço de alojamento partilhado](/links/web/hosting) da OVHcloud para os
    seus sites: espaço de armazenamento, bases de dados e instalação de CMS com
    um clique, numa infraestrutura gerida pela OVHcloud.
  aliases:
    - alojamento web
    - alojamento partilhado

zimbra:
  definition: >-
    Uma [solução de mensagens colaborativas de código aberto](/links/web/zimbra)
    proposta pela OVHcloud, que reúne emails, calendários e contactos numa única
    interface de webmail.

# --- Noções específicas da OVHcloud -----------------------------------------

anycastDns:
  definition: >-
    Uma [opção DNS paga](/links/web/domains-options-anycast) que replica a sua
    zona DNS em servidores espalhados pelo mundo: os pedidos DNS passam assim a
    ser respondidos a partir do local mais próximo do visitante.

automatedBackup:
  definition: >-
    Uma opção dos VPS que cria automaticamente uma
    [cópia de segurança diária](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    do seu servidor, com vários pontos de restauro à escolha.
  aliases:
    - cópia de segurança automatizada

dnsZone:
  definition: >-
    O conjunto dos registos DNS (A, MX, CNAME, etc.) que ligam um
    [nome de domínio](/links/web/domains) aos respetivos serviços, como um site
    ou o correio eletrónico. A zona DNS é gerida a partir da área de cliente
    OVHcloud.
  aliases:
    - zona DNS

kvmConsole:
  definition: >-
    Uma consola remota (Keyboard, Video, Mouse) disponível para os VPS e os
    servidores dedicados na área de cliente OVHcloud: dá-lhe acesso ao ecrã e ao
    teclado da máquina, mesmo quando esta já não está acessível através da rede.
  aliases:
    - consola KVM

multisite:
  definition: >-
    Uma [funcionalidade dos alojamentos web](/links/web/hosting-multisite) que
    permite alojar vários sites, cada um com o seu próprio domínio ou
    subdomínio, num único alojamento.

ovhconfig:
  definition: >-
    Um ficheiro de configuração situado na raiz do espaço de armazenamento do seu
    alojamento web, que determina o ambiente de execução do site (versão do PHP,
    modo de produção ou de desenvolvimento, firewall aplicacional).

snapshot:
  definition: >-
    Uma imagem manual de um VPS num dado momento, que pode
    [restaurar em qualquer altura](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps).
    É geralmente criada antes de uma operação de risco.
