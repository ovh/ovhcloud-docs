# OVHcloud documentation glossary — English (source locale).
#
# One entry per term, keyed in camelCase (i18n key convention). Entry schema
# (cross-repo contract — keep minimal, change deliberately):
#   definition   (required) — Markdown-lite: **bold**, *italic*, `code`, [link](url).
#                             Keep it short: this renders inside a tooltip.
#   aliases      (optional) — alternative surface forms the tagging pass should match
#                             (the key itself is always matched, case-insensitively).
#   abbreviation (optional) — short form of the term, if one exists.
#   relatedTerms (optional) — keys of other entries in this glossary.
#
# Links: `/links/<key>` entries resolve per locale via config/links.ts;
# `/guides/...` paths are internal, locale-less doc routes.
# Missing entry in another locale's file → the EN definition is shown (silent
# fallback); the validator reports it as a translation gap.

# --- Products & services ---------------------------------------------------

additionalIp:
  definition: >-
    An extra [public IP address](/links/network/additional-ip) that you can
    order and attach to a compatible OVHcloud service, and move from one
    service to another at any time.
  aliases:
    - failover IP
  relatedTerms:
    - vrack

cdnInfrastructure:
  definition: >-
    OVHcloud's [content delivery network](/links/network/cdn-infrastructure):
    caches your website's content in points of presence around the world to
    speed up delivery to visitors.

dedicatedServer:
  definition: >-
    A [physical server](/links/bare-metal/bare-metal) rented in its entirety:
    you get exclusive use of the hardware, with full administrative access.
  relatedTerms:
    - vps
    - kvmConsole

emailPro:
  definition: >-
    OVHcloud's [professional email offer](/links/web/email-pro): one dedicated
    mailbox per user, with webmail access and synchronisation across devices.
  relatedTerms:
    - mxPlan
    - hostedExchange

hostedExchange:
  definition: >-
    OVHcloud's [hosted Microsoft Exchange service](/links/web/emails-hosted-exchange):
    collaborative email with shared calendars, contacts and tasks, hosted and
    managed by OVHcloud.
  aliases:
    - Exchange
  relatedTerms:
    - emailPro
    - mxPlan

loadBalancer:
  definition: >-
    An OVHcloud service that [distributes incoming traffic](/links/network/load-balancer)
    across several of your services to improve availability and performance.

managedWordpress:
  definition: >-
    OVHcloud's [managed WordPress offer](/links/web/hosting-wordpress):
    OVHcloud handles the installation, updates and security of your WordPress
    site so you can focus on its content.
  aliases:
    - Managed Hosting for WordPress
  relatedTerms:
    - webHosting

mxPlan:
  definition: >-
    OVHcloud's [standard email solution](/links/web/emails), included with
    domain names and Web Hosting plans: mailboxes with webmail access and
    spam/virus protection.
  relatedTerms:
    - emailPro
    - hostedExchange

ovhcloudApi:
  definition: >-
    The RESTful interface for managing OVHcloud services programmatically,
    covering everything available in the Control Panel and more. See
    [First steps with the OVHcloud API](/guides/manage-and-operate/api/first-steps).
  relatedTerms:
    - ovhcloudControlPanel

ovhcloudConnect:
  definition: >-
    A [private, secure connection](/links/network/ovhcloud-connect) between
    your own infrastructure (datacentre, offices) and the OVHcloud network.
  abbreviation: OCC
  relatedTerms:
    - vrack

ovhcloudControlPanel:
  definition: >-
    The web interface for managing all your OVHcloud products and services:
    ordering, configuration, billing and user management. See the
    [navigation guide](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - Control Panel
  relatedTerms:
    - ovhcloudApi

sslGateway:
  definition: >-
    An OVHcloud service that [secures your website](/links/web/ssl-gateway) by
    encrypting traffic between visitors and your server with SSL/TLS, without
    installing a certificate on the server itself.

vps:
  definition: >-
    A [Virtual Private Server](/links/bare-metal/vps): a virtual machine with
    guaranteed resources and full root access, hosted on OVHcloud
    infrastructure.
  aliases:
    - Virtual Private Server
  relatedTerms:
    - dedicatedServer
    - snapshot
    - automatedBackup

vrack:
  definition: >-
    OVHcloud's [private network](/links/network/vrack): connects eligible
    OVHcloud services to each other in an isolated network, even across
    different datacentres.
  relatedTerms:
    - additionalIp
    - ovhcloudConnect

webCloudDatabases:
  definition: >-
    A [standalone database service](/links/web/databases) for web projects,
    providing dedicated resources for your databases outside your hosting
    plan.
  aliases:
    - CloudDB
    - Cloud Databases
  relatedTerms:
    - webHosting

webHosting:
  definition: >-
    OVHcloud's [shared hosting service](/links/web/hosting) for websites:
    storage, databases and one-click CMS installation on infrastructure
    managed by OVHcloud.
  relatedTerms:
    - multisite
    - webCloudDatabases
    - ovhconfig

zimbra:
  definition: >-
    An [open-source collaborative messaging solution](/links/web/zimbra)
    offered by OVHcloud, combining email, calendars and contacts in a single
    webmail interface.
  relatedTerms:
    - mxPlan

# --- OVHcloud-specific concepts --------------------------------------------

anycastDns:
  definition: >-
    A [paid DNS option](/links/web/domains-options-anycast) that replicates
    your DNS zone on servers around the world, so DNS queries are answered
    from the location closest to the visitor.
  relatedTerms:
    - dnsZone

automatedBackup:
  definition: >-
    A VPS option that automatically creates a
    [daily backup](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    of your server, with several restore points to choose from.
  relatedTerms:
    - snapshot
    - vps

dnsZone:
  definition: >-
    The set of DNS records (A, MX, CNAME, etc.) that connects a
    [domain name](/links/web/domains) to its services, such as a website or
    email. Managed from the OVHcloud Control Panel.
  relatedTerms:
    - anycastDns

kvmConsole:
  definition: >-
    A remote console (Keyboard, Video, Mouse) available for VPS and Dedicated
    Servers in the OVHcloud Control Panel: it gives you screen and keyboard
    access to the machine even when it is unreachable over the network.
  abbreviation: KVM
  relatedTerms:
    - dedicatedServer
    - vps

multisite:
  definition: >-
    A [Web Hosting feature](/links/web/hosting-multisite) that lets you host
    several websites, each with its own domain or subdomain, on a single
    hosting plan.
  relatedTerms:
    - webHosting

ovhconfig:
  definition: >-
    A configuration file at the root of your Web Hosting storage space that
    controls your website's runtime environment (PHP version, production or
    development mode, firewall).
  aliases:
    - .ovhconfig
  relatedTerms:
    - webHosting

snapshot:
  definition: >-
    A manual, point-in-time image of a VPS that you can
    [restore at any time](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    typically taken before a risky change.
  relatedTerms:
    - automatedBackup
    - vps
