# OVHcloud documentation glossary — English (source locale).
#
# One entry per term, keyed in camelCase (i18n key convention). Entry schema
# (cross-repo contract — keep minimal, change deliberately):
#   definition   (required) — Markdown-lite: **bold**, *italic*, `code`, [link](url).
#                             Keep it short: this renders inside a tooltip.
#   aliases      (optional) — alternative surface forms the tagging pass should match
#                             (the key itself is always matched, case-insensitively).
#   abbreviation (optional) — short form of the term, if one exists.
#   relatedTerms (optional) — keys of other entries in this glossary.
#
# Scope: a term belongs here when a non-technical reader would NOT understand it
# from the surrounding prose. Product names are deliberately excluded — they are
# ordered, not explained, and the guide the reader is already on is the
# explanation. Terms kept despite naming a product (mxPlan, zimbra, vrack,
# multisite) are those whose NAME conveys nothing about what they are.
#
# Bound: the test is comprehension IN AN OVHCLOUD CONTEXT — a term qualifies when
# the reader meets it in our UI, a config field, or a guide step they must act on
# (spf, ttl, htaccess). General IT vocabulary merely encountered elsewhere (ssh,
# raid, tls, bgp) stays out, or the glossary grows without limit.
#
# Links: `/links/<key>` entries resolve per locale via config/links.ts;
# `/guides/...` paths are internal, locale-less doc routes.
# Missing entry in another locale's file → the EN definition is shown (silent
# fallback); the validator reports it as a translation gap.

# --- OVHcloud-specific concepts ---------------------------------------------

anycastDns:
  definition: >-
    A [paid DNS option](/links/web/domains-options-anycast) that replicates
    your DNS zone on servers around the world, so DNS queries are answered
    from the location closest to the visitor.
  relatedTerms:
    - dnsZone

automatedBackup:
  definition: >-
    A VPS option that automatically creates a
    [daily backup](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    of your server, with several restore points to choose from.
  relatedTerms:
    - snapshot

kvmConsole:
  definition: >-
    A remote console (Keyboard, Video, Mouse) available for VPS and Dedicated
    Servers in the OVHcloud Control Panel: it gives you screen and keyboard
    access to the machine even when it is unreachable over the network.
  abbreviation: KVM

multisite:
  definition: >-
    A [Web Hosting feature](/links/web/hosting-multisite) that lets you host
    several websites, each with its own domain or subdomain, on a single
    hosting plan.

mxPlan:
  definition: >-
    OVHcloud's [standard email solution](/links/web/emails), included with
    domain names and Web Hosting plans: mailboxes with webmail access and
    spam/virus protection.
  relatedTerms:
    - zimbra

ovhcloudApi:
  definition: >-
    The RESTful interface for managing OVHcloud services programmatically,
    covering everything available in the Control Panel and more. See
    [First steps with the OVHcloud API](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    A configuration file at the root of your Web Hosting storage space that
    controls your website's runtime environment (PHP version, production or
    development mode, firewall).
  aliases:
    - .ovhconfig
  relatedTerms:
    - htaccess

snapshot:
  definition: >-
    A manual, point-in-time image of a VPS that you can
    [restore at any time](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    typically taken before a risky change.
  relatedTerms:
    - automatedBackup

vrack:
  definition: >-
    OVHcloud's [private network](/links/network/vrack): connects eligible
    OVHcloud services to each other in an isolated network, even across
    different datacentres.

zimbra:
  definition: >-
    An [open-source collaborative messaging solution](/links/web/zimbra)
    offered by OVHcloud, combining email, calendars and contacts in a single
    webmail interface.
  relatedTerms:
    - mxPlan

# --- DNS and domain names ---------------------------------------------------

aRecord:
  definition: >-
    The DNS record that points a domain name to an IPv4 address — the entry
    that sends visitors to the server hosting your website. The IPv6
    equivalent is the AAAA record.
  aliases:
    - A record
    - AAAA record
  relatedTerms:
    - dnsZone
    - cname

cname:
  definition: >-
    A DNS record that makes one name an alias of another, so it follows
    whatever the target points to. Often used for subdomains such as `www`.
  aliases:
    - CNAME
    - CNAME record
  relatedTerms:
    - dnsZone
    - aRecord

dnsPropagation:
  definition: >-
    The delay before a DNS change is visible everywhere. Servers around the
    world keep the previous values in cache until the record's **TTL**
    expires, which can take up to 24 hours.
  aliases:
    - propagation
  relatedTerms:
    - ttl
    - dnsZone

dnsZone:
  definition: >-
    The set of DNS records (A, MX, CNAME, etc.) that connects a
    [domain name](/links/web/domains) to its services, such as a website or
    email. Managed from the OVHcloud Control Panel.
  aliases:
    - DNS zone
  relatedTerms:
    - anycastDns
    - ttl

dnssec:
  definition: >-
    A DNS security extension that signs your zone's records, so a resolver can
    verify the answer it receives really comes from your domain and has not
    been tampered with.
  abbreviation: DNSSEC
  relatedTerms:
    - dnsZone

glueRecord:
  definition: >-
    A DNS record that gives the IP address of a nameserver whose own name sits
    inside the domain it serves — breaking the circular lookup that would
    otherwise make the domain unresolvable.
  aliases:
    - glue record
  relatedTerms:
    - dnsZone

mxRecord:
  definition: >-
    The DNS record that names the mail servers receiving email for a domain.
    Its priority value decides which server is tried first.
  aliases:
    - MX record
  relatedTerms:
    - dnsZone

ttl:
  definition: >-
    *Time To Live* — how long, in seconds, servers may keep a DNS record in
    cache before checking it again. A lower TTL propagates changes faster; a
    higher one reduces lookups.
  abbreviation: TTL
  relatedTerms:
    - dnsPropagation
    - dnsZone

wildcard:
  definition: >-
    An entry using `*` to match every name at a level at once — a wildcard DNS
    record covers all undeclared subdomains, and a wildcard SSL certificate
    secures them all.
  aliases:
    - wildcard record
  relatedTerms:
    - dnsZone

# --- Email ------------------------------------------------------------------

catchAll:
  definition: >-
    A mailbox that receives every message sent to an address on your domain
    that does not exist, instead of letting it bounce.
  aliases:
    - catch-all
  relatedTerms:
    - mxRecord

dkim:
  definition: >-
    An email standard that adds a cryptographic signature to your outgoing
    messages, letting the recipient's server verify they really come from your
    domain and were not altered in transit.
  abbreviation: DKIM
  relatedTerms:
    - spf
    - dmarc

dmarc:
  definition: >-
    An email standard that builds on **SPF** and **DKIM**: it tells receiving
    servers what to do with messages that fail those checks, and where to send
    reports.
  abbreviation: DMARC
  relatedTerms:
    - spf
    - dkim

imap:
  definition: >-
    An email protocol that keeps your messages on the server and synchronises
    them across every device. Unlike **POP**, reading or deleting on one
    device is reflected everywhere.
  abbreviation: IMAP
  relatedTerms:
    - pop
    - smtp

pop:
  definition: >-
    An email protocol that downloads messages to a single device, usually
    removing them from the server. Prefer **IMAP** if you read your email on
    more than one device.
  abbreviation: POP
  relatedTerms:
    - imap
    - smtp

smtp:
  definition: >-
    The protocol used to *send* email. Your mail client connects to an SMTP
    server to submit a message; **IMAP** and **POP** are what it uses to read
    them.
  abbreviation: SMTP
  relatedTerms:
    - imap
    - pop

spf:
  definition: >-
    A DNS record listing the servers allowed to send email for your domain, so
    receiving servers can reject messages that forge your address.
  abbreviation: SPF
  relatedTerms:
    - dkim
    - dmarc

# --- Hosting, files and tools -----------------------------------------------

cron:
  definition: >-
    A scheduled task that runs a script automatically at a set time or
    interval — for example a nightly maintenance job on your website.
  aliases:
    - cron job
    - cron task

htaccess:
  definition: >-
    A configuration file placed in a website directory to control the web
    server's behaviour for that folder: redirects, access restrictions,
    password protection and error pages.
  aliases:
    - .htaccess
  relatedTerms:
    - ovhconfig

phpmyadmin:
  definition: >-
    A web interface for administering a MySQL or MariaDB database: browsing
    tables, running queries, and importing or exporting the database — without
    a command line.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    A file-transfer protocol that runs over an SSH connection, so credentials
    and data are encrypted. Prefer it over plain **FTP**, which sends
    everything in clear text.
  abbreviation: SFTP
