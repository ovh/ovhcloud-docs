# Glossario della documentazione OVHcloud — italiano.
#
# Traduzione di en.yaml (a partire dalla versione francese, secondo le regole
# di traduzione). Le chiavi devono esistere in en.yaml e non vengono mai
# tradotte. L'unione avviene campo per campo: una voce che fornisce solo
# `definition:` conserva `aliases`, `abbreviation` e `relatedTerms` della
# versione inglese. Qui vengono ridichiarati solo se differiscono realmente
# (forme utilizzate nei testi italiani).
#
# I link `/links/<chiave>` e `/guides/...` restano invariati: vengono risolti
# per lingua durante la generazione.

# --- Prodotti e servizi -----------------------------------------------------

additionalIp:
  definition: >-
    Un [indirizzo IP pubblico aggiuntivo](/links/network/additional-ip) che è
    possibile ordinare e associare a un servizio OVHcloud compatibile, e
    spostare da un servizio all'altro in qualsiasi momento.
  aliases:
    - IP failover
    - IP aggiuntivo

cdnInfrastructure:
  definition: >-
    La [rete di distribuzione dei contenuti](/links/network/cdn-infrastructure)
    di OVHcloud: memorizza nella cache i contenuti del tuo sito Web in punti di
    presenza in tutto il mondo, per accelerarne la visualizzazione ai
    visitatori.

dedicatedServer:
  definition: >-
    Un [server fisico](/links/bare-metal/bare-metal) affittato per intero:
    disponi di un utilizzo esclusivo dell'hardware, con accesso amministrativo
    completo.
  aliases:
    - server dedicato

emailPro:
  definition: >-
    L'[offerta di email professionali](/links/web/email-pro) di OVHcloud: una
    casella email dedicata per ogni utente, con accesso via webmail e
    sincronizzazione su tutti i dispositivi.

hostedExchange:
  definition: >-
    Il [servizio Microsoft Exchange ospitato](/links/web/emails-hosted-exchange)
    di OVHcloud: messaggistica collaborativa con calendari, contatti e attività
    condivisi, ospitata e gestita da OVHcloud.
  aliases:
    - Exchange

loadBalancer:
  definition: >-
    Un servizio OVHcloud che [distribuisce il traffico in entrata](/links/network/load-balancer)
    tra più servizi, per migliorarne la disponibilità e le prestazioni.

managedWordpress:
  definition: >-
    L'[offerta WordPress gestita](/links/web/hosting-wordpress) di OVHcloud:
    OVHcloud si occupa dell'installazione, degli aggiornamenti e della sicurezza
    del tuo sito WordPress, così puoi concentrarti sui contenuti.

mxPlan:
  definition: >-
    La [soluzione email standard](/links/web/emails) di OVHcloud, inclusa con i
    nomi a dominio e i piani di hosting Web: caselle email con accesso via
    webmail e protezione da spam e virus.

ovhcloudApi:
  definition: >-
    L'interfaccia RESTful che permette di gestire i servizi OVHcloud in modo
    programmatico. Comprende tutto ciò che è disponibile nello Spazio Cliente
    OVHcloud, e altro ancora. Consulta
    [Primi passi con le API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhcloudConnect:
  definition: >-
    Una [connessione privata e sicura](/links/network/ovhcloud-connect) tra la
    tua infrastruttura (datacenter, uffici) e la rete OVHcloud.

ovhcloudControlPanel:
  definition: >-
    L'interfaccia Web che permette di gestire tutti i tuoi prodotti e servizi
    OVHcloud: ordini, configurazione, fatturazione e gestione degli utenti.
    Consulta la
    [guida alla navigazione](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - Spazio Cliente
    - Spazio Cliente OVHcloud

sslGateway:
  definition: >-
    Un servizio OVHcloud che [protegge il tuo sito Web](/links/web/ssl-gateway)
    cifrando il traffico tra i visitatori e il server tramite SSL/TLS, senza
    dover installare un certificato sul server stesso.

vps:
  definition: >-
    Un [Virtual Private Server](/links/bare-metal/vps): una macchina virtuale
    con risorse garantite e accesso root completo, ospitata sull'infrastruttura
    OVHcloud.
  aliases:
    - Virtual Private Server
    - server privato virtuale

vrack:
  definition: >-
    La [rete privata](/links/network/vrack) di OVHcloud: collega tra loro i
    servizi OVHcloud compatibili all'interno di una rete isolata, anche tra
    datacenter differenti.

webCloudDatabases:
  definition: >-
    Un [servizio di database autonomo](/links/web/databases) destinato ai
    progetti Web, che fornisce risorse dedicate ai tuoi database al di fuori del
    piano di hosting.

webHosting:
  definition: >-
    Il [servizio di hosting condiviso](/links/web/hosting) di OVHcloud per i
    tuoi siti Web: spazio di archiviazione, database e installazione di CMS con
    un clic, su un'infrastruttura gestita da OVHcloud.
  aliases:
    - hosting Web
    - hosting condiviso

zimbra:
  definition: >-
    Una [soluzione di messaggistica collaborativa open source](/links/web/zimbra)
    proposta da OVHcloud, che riunisce email, calendari e contatti in un'unica
    interfaccia webmail.

# --- Concetti specifici di OVHcloud -----------------------------------------

anycastDns:
  definition: >-
    Un'[opzione DNS a pagamento](/links/web/domains-options-anycast) che replica
    la tua zona DNS su server in tutto il mondo: le richieste DNS vengono così
    gestite dalla postazione più vicina al visitatore.

automatedBackup:
  definition: >-
    Un'opzione VPS che crea automaticamente un
    [backup quotidiano](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    del server, con diversi punti di ripristino disponibili.
  aliases:
    - backup automatico

dnsZone:
  definition: >-
    L'insieme dei record DNS (A, MX, CNAME, ecc.) che collegano un
    [nome a dominio](/links/web/domains) ai suoi servizi, come un sito Web o la
    posta elettronica. La zona DNS si gestisce dallo Spazio Cliente OVHcloud.
  aliases:
    - zona DNS

kvmConsole:
  definition: >-
    Una console remota (Keyboard, Video, Mouse) disponibile per i VPS e i server
    dedicati nello Spazio Cliente OVHcloud: consente di accedere allo schermo e
    alla tastiera della macchina, anche quando non è più raggiungibile dalla
    rete.
  aliases:
    - console KVM

multisite:
  definition: >-
    Una [funzionalità dei piani di hosting Web](/links/web/hosting-multisite)
    che permette di ospitare più siti Web, ognuno con il proprio dominio o
    sottodominio, su un unico piano di hosting.

ovhconfig:
  definition: >-
    Un file di configurazione situato nella radice dello spazio di archiviazione
    del tuo hosting Web, che determina l'ambiente di esecuzione del sito
    (versione di PHP, modalità di produzione o di sviluppo, firewall
    applicativo).

snapshot:
  definition: >-
    Un'immagine manuale di un VPS in un dato momento, che è possibile
    [ripristinare in qualsiasi istante](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps).
    Viene generalmente creata prima di un'operazione a rischio.
