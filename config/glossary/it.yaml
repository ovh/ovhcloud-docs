# Glossario della documentazione OVHcloud — italiano.
#
# Traduzione di en.yaml. Le chiavi devono esistere in en.yaml: non vengono mai
# tradotte. L'unione avviene campo per campo, quindi una voce che fornisce solo
# `definition:` conserva `aliases`, `abbreviation` e `relatedTerms`
# dell'inglese: vengono ridichiarati qui solo quando differiscono realmente
# (forme presenti nei testi italiani).
#
# Gli acronimi tecnici (TTL, SPF, DKIM, DMARC, IMAP, POP, SMTP, SFTP, DNSSEC)
# non si traducono: restano invariati, secondo l'uso delle guide italiane.
#
# I link `/links/<chiave>` e `/guides/...` sono ripresi tali e quali: vengono
# risolti per lingua in fase di generazione.

# --- Nozioni proprie di OVHcloud --------------------------------------------

anycastDns:
  definition: >-
    Un'[opzione DNS a pagamento](/links/web/domains-options-anycast) che
    replica la tua zona DNS su server distribuiti in tutto il mondo: in questo
    modo le richieste DNS vengono gestite dalla località più vicina al
    visitatore.

automatedBackup:
  definition: >-
    Un'opzione VPS che crea automaticamente un
    [backup quotidiano](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    del tuo server, con diversi punti di ripristino a scelta.
  aliases:
    - backup automatico

kvmConsole:
  definition: >-
    Una console remota (Keyboard, Video, Mouse) disponibile per i VPS e i
    server dedicati nello Spazio Cliente OVHcloud: permette di accedere allo
    schermo e alla tastiera della macchina, anche quando non è più
    raggiungibile in rete.
  aliases:
    - console KVM

multisite:
  definition: >-
    Una [funzionalità degli hosting Web](/links/web/hosting-multisite) che
    permette di ospitare più siti Web, ciascuno con il proprio dominio o
    sottodominio, su uno stesso hosting.

mxPlan:
  definition: >-
    La [soluzione email standard](/links/web/emails) di OVHcloud, inclusa con i
    nomi a dominio e gli hosting Web: indirizzi email con accesso webmail e
    protezione contro spam e virus.

ovhcloudApi:
  definition: >-
    L'interfaccia RESTful che permette di gestire i tuoi servizi OVHcloud in
    modo programmatico. Copre tutto ciò che è disponibile nello Spazio Cliente
    OVHcloud, e altro ancora. Consulta la guida
    [Primi passi con le API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    Un file di configurazione situato nella radice dello spazio di
    archiviazione del tuo hosting Web, che determina l'ambiente di esecuzione
    del tuo sito (versione di PHP, modalità produzione o sviluppo, firewall
    applicativo).

snapshot:
  definition: >-
    Un'immagine manuale di un VPS in un momento preciso, che puoi
    [ripristinare in qualsiasi momento](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    generalmente creata prima di un'operazione a rischio.

vrack:
  definition: >-
    La [rete privata](/links/network/vrack) di OVHcloud: collega tra loro i
    tuoi servizi OVHcloud compatibili all'interno di una rete isolata, anche
    tra datacenter diversi.

zimbra:
  definition: >-
    Una [soluzione di messaggistica collaborativa open source](/links/web/zimbra)
    proposta da OVHcloud, che riunisce email, calendari e contatti in un'unica
    interfaccia webmail.

# --- DNS e nomi a dominio ---------------------------------------------------

aRecord:
  definition: >-
    Il record DNS che associa un nome a dominio a un indirizzo IPv4, ovvero
    quello che indirizza i visitatori verso il server che ospita il tuo sito
    Web. Il suo equivalente in IPv6 è il record AAAA.
  aliases:
    - record A
    - record AAAA

cname:
  definition: >-
    Un record DNS che rende un nome alias di un altro: segue quindi ciò che
    punta la sua destinazione. È spesso utilizzato per i sottodomini, come
    `www`.
  aliases:
    - CNAME
    - record CNAME

dnsPropagation:
  definition: >-
    Il tempo necessario perché una modifica DNS sia visibile ovunque. I server
    di tutto il mondo conservano i valori precedenti in cache fino alla
    scadenza del **TTL** del record, il che può richiedere fino a 24 ore.
  aliases:
    - propagazione
    - propagazione DNS

dnsZone:
  definition: >-
    L'insieme dei record DNS (A, MX, CNAME, ecc.) che collegano un
    [nome a dominio](/links/web/domains) ai suoi servizi, come un sito Web o
    un servizio email. La zona DNS si gestisce dallo Spazio Cliente OVHcloud.
  aliases:
    - zona DNS

dnssec:
  definition: >-
    Un'estensione di sicurezza del DNS che firma i record della tua zona: un
    resolver può così verificare che la risposta ricevuta provenga davvero dal
    tuo dominio e non sia stata alterata.

glueRecord:
  definition: >-
    Un record DNS che fornisce l'indirizzo IP di un server DNS il cui nome
    appartiene al dominio che serve. Evita così il loop di risoluzione che
    renderebbe il dominio irraggiungibile.
  aliases:
    - glue record

mxRecord:
  definition: >-
    Il record DNS che indica i server di posta che ricevono le email di un
    dominio. Il suo valore di priorità determina quale server viene
    interrogato per primo.
  aliases:
    - record MX

ttl:
  definition: >-
    *Time To Live*: la durata, in secondi, per cui i server possono conservare
    un record DNS in cache prima di verificarlo di nuovo. Un TTL basso accelera
    la propagazione delle modifiche, un TTL elevato riduce il numero di
    richieste.

wildcard:
  definition: >-
    Una voce che utilizza `*` per coprire in una sola volta tutti i nomi di uno
    stesso livello: un record DNS wildcard copre tutti i sottodomini non
    dichiarati e un certificato SSL wildcard li protegge tutti.
  aliases:
    - record wildcard

# --- Posta elettronica ------------------------------------------------------

catchAll:
  definition: >-
    Un indirizzo email che riceve tutti i messaggi inviati a un indirizzo
    inesistente del tuo dominio, invece di lasciare che vengano rifiutati.
  aliases:
    - catch-all

dkim:
  definition: >-
    Uno standard di posta elettronica che aggiunge una firma crittografica alle
    tue email in uscita: il server destinatario può così verificare che
    provengano davvero dal tuo dominio e che non siano state modificate lungo
    il percorso.

dmarc:
  definition: >-
    Uno standard di posta elettronica basato su **SPF** e **DKIM**: indica ai
    server destinatari come trattare i messaggi che non superano queste
    verifiche e l'indirizzo a cui inviare i report.

imap:
  definition: >-
    Un protocollo di posta elettronica che conserva i messaggi sul server e li
    sincronizza su tutti i tuoi dispositivi. A differenza di **POP**, leggere o
    eliminare un messaggio su un dispositivo ha effetto ovunque.

pop:
  definition: >-
    Un protocollo di posta elettronica che scarica i messaggi su un solo
    dispositivo, generalmente eliminandoli dal server. Preferisci **IMAP** se
    consulti le tue email da più dispositivi.

smtp:
  definition: >-
    Il protocollo utilizzato per *inviare* le email. Il tuo client di posta si
    connette a un server SMTP per trasmettere un messaggio, mentre **IMAP** e
    **POP** servono a consultarle.

spf:
  definition: >-
    Un record DNS che elenca i server autorizzati a inviare email per il tuo
    dominio, in modo che i server destinatari possano rifiutare i messaggi che
    usurpano il tuo indirizzo.

# --- Hosting, file e strumenti ----------------------------------------------

cron:
  definition: >-
    Un'operazione pianificata che esegue automaticamente uno script a un orario
    o con una periodicità definita, per esempio un'operazione di manutenzione
    notturna sul tuo sito Web.
  aliases:
    - cron job
    - operazione pianificata

htaccess:
  definition: >-
    Un file di configurazione inserito in una directory del tuo sito Web per
    controllare il comportamento del server Web in quella cartella:
    reindirizzamenti, restrizioni di accesso, protezione tramite password e
    pagine di errore.
  aliases:
    - .htaccess

phpmyadmin:
  definition: >-
    Un'interfaccia Web che permette di amministrare un database MySQL o
    MariaDB: consultazione delle tabelle, esecuzione di query, importazione ed
    esportazione del database, senza passare dalla riga di comando.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    Un protocollo di trasferimento file che funziona all'interno di una
    connessione SSH: le credenziali e i dati sono cifrati. È da preferire al
    **FTP** classico, che trasmette tutto in chiaro.
