# Glossar der OVHcloud-Dokumentation — Deutsch.
#
# Übersetzung von en.yaml. Die Schlüssel müssen in en.yaml vorhanden sein und
# werden niemals übersetzt. Die Zusammenführung erfolgt feldweise: Ein Eintrag,
# der nur `definition:` liefert, übernimmt `aliases`, `abbreviation` und
# `relatedTerms` aus dem Englischen. Sie werden hier nur dann erneut angegeben,
# wenn sie sich tatsächlich unterscheiden (im deutschen Text übliche Formen).
#
# Technische Akronyme (TTL, SPF, DKIM, DMARC, IMAP, POP, SMTP, SFTP, DNSSEC)
# werden nicht übersetzt: Sie bleiben unverändert, wie in den deutschen
# Anleitungen üblich.
#
# Die Links `/links/<key>` und `/guides/...` werden unverändert übernommen: Sie
# werden bei der Generierung pro Sprache aufgelöst.

# --- OVHcloud-spezifische Begriffe ------------------------------------------

anycastDns:
  definition: >-
    Eine [kostenpflichtige DNS-Option](/links/web/domains-options-anycast), die
    Ihre DNS-Zone auf Servern weltweit repliziert. DNS-Anfragen werden dadurch
    vom Standort beantwortet, der dem Besucher am nächsten liegt.

automatedBackup:
  definition: >-
    Eine VPS-Option, die automatisch ein
    [tägliches Backup](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    Ihres Servers erstellt, mit mehreren Wiederherstellungspunkten zur Auswahl.
  aliases:
    - automatisiertes Backup
    - automatische Sicherung

kvmConsole:
  definition: >-
    Eine Remote-Konsole (Keyboard, Video, Mouse), die für VPS und Dedicated
    Server im OVHcloud Kundencenter verfügbar ist: Sie gibt Ihnen Zugriff auf
    Bildschirm und Tastatur der Maschine, selbst wenn diese über das Netzwerk
    nicht mehr erreichbar ist.
  aliases:
    - KVM-Konsole

multisite:
  definition: >-
    Eine [Funktion des Webhostings](/links/web/hosting-multisite), mit der Sie
    mehrere Websites, jede mit ihrer eigenen Domain oder Subdomain, auf einem
    einzigen Hosting-Paket betreiben können.

mxPlan:
  definition: >-
    Die [Standard-E-Mail-Lösung](/links/web/emails) von OVHcloud, die in
    Domainnamen und Webhosting-Paketen enthalten ist: E-Mail-Adressen mit
    Webmail-Zugang sowie Spam- und Virenschutz.

ovhcloudApi:
  definition: >-
    Die RESTful-Schnittstelle zur programmatischen Verwaltung Ihrer
    OVHcloud Dienste. Sie umfasst alles, was im Kundencenter verfügbar ist, und
    mehr. Siehe
    [Erste Schritte mit der OVHcloud API](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    Eine Konfigurationsdatei im Stammverzeichnis des Speicherplatzes Ihres
    Webhostings, die die Laufzeitumgebung Ihrer Website steuert (PHP-Version,
    Produktions- oder Entwicklungsmodus, Firewall).

snapshot:
  definition: >-
    Ein manuell erstelltes Abbild eines VPS zu einem bestimmten Zeitpunkt, das
    Sie [jederzeit wiederherstellen](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps)
    können. Es wird üblicherweise vor einem riskanten Eingriff angelegt.

vrack:
  definition: >-
    Das [private Netzwerk](/links/network/vrack) von OVHcloud: Es verbindet
    Ihre berechtigten OVHcloud Dienste innerhalb eines isolierten Netzwerks
    miteinander, auch über verschiedene Rechenzentren hinweg.

zimbra:
  definition: >-
    Eine von OVHcloud angebotene
    [Open-Source-Lösung für kollaborative Messaging-Dienste](/links/web/zimbra),
    die E-Mails, Kalender und Kontakte in einer einzigen Webmail-Oberfläche
    vereint.

# --- DNS und Domainnamen ----------------------------------------------------

aRecord:
  definition: >-
    Der DNS-Eintrag, der einen Domainnamen mit einer IPv4-Adresse verknüpft —
    also derjenige, der Ihre Besucher zu dem Server leitet, auf dem Ihre
    Website gehostet wird. Das Äquivalent für IPv6 ist der AAAA-Eintrag.
  aliases:
    - A record
    - AAAA record
    - A-Eintrag
    - AAAA-Eintrag

cname:
  definition: >-
    Ein DNS-Eintrag, der einen Namen zum Alias eines anderen macht: Er folgt
    damit dem, worauf sein Ziel verweist. Er wird häufig für Subdomains wie
    `www` verwendet.
  aliases:
    - CNAME
    - CNAME record
    - CNAME-Eintrag

dnsPropagation:
  definition: >-
    Die Zeitspanne, bis eine DNS-Änderung überall sichtbar ist. Server
    weltweit behalten die alten Werte im Cache, bis der **TTL** des Eintrags
    abläuft. Dies kann bis zu 24 Stunden dauern.
  aliases:
    - propagation
    - DNS-Propagation

dnsZone:
  definition: >-
    Die Gesamtheit der DNS-Einträge (A, MX, CNAME usw.), die einen
    [Domainnamen](/links/web/domains) mit seinen Diensten verbindet, etwa einer
    Website oder einem E-Mail-Dienst. Die Verwaltung erfolgt über das
    OVHcloud Kundencenter.
  aliases:
    - DNS zone
    - DNS-Zone

dnssec:
  definition: >-
    Eine Sicherheitserweiterung des DNS, die die Einträge Ihrer Zone signiert.
    Ein Resolver kann so überprüfen, ob die erhaltene Antwort tatsächlich von
    Ihrer Domain stammt und nicht verändert wurde.

glueRecord:
  definition: >-
    Ein DNS-Eintrag, der die IP-Adresse eines Nameservers angibt, dessen
    eigener Name innerhalb der von ihm bedienten Domain liegt. Er verhindert
    damit die Auflösungsschleife, die die Domain sonst unerreichbar machen
    würde.
  aliases:
    - glue record
    - Glue-Record

mxRecord:
  definition: >-
    Der DNS-Eintrag, der die Mailserver benennt, die E-Mails für eine Domain
    empfangen. Sein Prioritätswert bestimmt, welcher Server zuerst angesprochen
    wird.
  aliases:
    - MX record
    - MX-Eintrag

ttl:
  definition: >-
    *Time To Live* — die Dauer in Sekunden, für die Server einen DNS-Eintrag
    im Cache behalten dürfen, bevor sie ihn erneut prüfen. Ein niedriger TTL
    beschleunigt die Verbreitung von Änderungen, ein höherer verringert die
    Anzahl der Anfragen.

wildcard:
  definition: >-
    Ein Eintrag, der mit `*` alle Namen einer Ebene auf einmal abdeckt: Ein
    Wildcard-DNS-Eintrag umfasst alle nicht deklarierten Subdomains, und ein
    Wildcard-SSL-Zertifikat sichert sie alle ab.
  aliases:
    - wildcard record
    - Wildcard-Eintrag

# --- E-Mail -----------------------------------------------------------------

catchAll:
  definition: >-
    Ein Postfach, das alle Nachrichten empfängt, die an eine nicht existierende
    Adresse Ihrer Domain gesendet werden, anstatt sie zurückweisen zu lassen.
  aliases:
    - catch-all

dkim:
  definition: >-
    Ein E-Mail-Standard, der Ihren ausgehenden Nachrichten eine kryptografische
    Signatur hinzufügt. Der Server des Empfängers kann so überprüfen, ob sie
    tatsächlich von Ihrer Domain stammen und unterwegs nicht verändert wurden.

dmarc:
  definition: >-
    Ein E-Mail-Standard, der auf **SPF** und **DKIM** aufbaut: Er teilt den
    empfangenden Servern mit, wie sie mit Nachrichten verfahren sollen, die
    diese Prüfungen nicht bestehen, und wohin Berichte gesendet werden sollen.

imap:
  definition: >-
    Ein E-Mail-Protokoll, das Ihre Nachrichten auf dem Server belässt und sie
    auf allen Ihren Geräten synchronisiert. Anders als bei **POP** wirkt sich
    das Lesen oder Löschen auf einem Gerät überall aus.

pop:
  definition: >-
    Ein E-Mail-Protokoll, das Nachrichten auf ein einzelnes Gerät herunterlädt
    und sie dabei in der Regel vom Server entfernt. Bevorzugen Sie **IMAP**,
    wenn Sie Ihre E-Mails auf mehreren Geräten abrufen.

smtp:
  definition: >-
    Das Protokoll, das zum *Senden* von E-Mails verwendet wird. Ihr
    E-Mail-Programm verbindet sich mit einem SMTP-Server, um eine Nachricht zu
    übermitteln, während **IMAP** und **POP** dem Abrufen dienen.

spf:
  definition: >-
    Ein DNS-Eintrag, der die Server auflistet, die E-Mails für Ihre Domain
    versenden dürfen. Empfangende Server können dadurch Nachrichten abweisen,
    die Ihre Adresse fälschen.

# --- Hosting, Dateien und Tools ---------------------------------------------

cron:
  definition: >-
    Eine geplante Aufgabe, die ein Skript automatisch zu einer festgelegten
    Uhrzeit oder in einem festgelegten Intervall ausführt — zum Beispiel eine
    nächtliche Wartungsaufgabe auf Ihrer Website.
  aliases:
    - cron job
    - cron task
    - Cronjob
    - geplante Aufgabe

htaccess:
  definition: >-
    Eine Konfigurationsdatei, die in einem Verzeichnis Ihrer Website abgelegt
    wird, um das Verhalten des Webservers für diesen Ordner zu steuern:
    Weiterleitungen, Zugriffsbeschränkungen, Passwortschutz und Fehlerseiten.
  aliases:
    - .htaccess

phpmyadmin:
  definition: >-
    Eine Weboberfläche zur Verwaltung einer MySQL- oder MariaDB-Datenbank:
    Tabellen einsehen, Abfragen ausführen sowie die Datenbank importieren und
    exportieren — ganz ohne Kommandozeile.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    Ein Dateiübertragungsprotokoll, das über eine SSH-Verbindung läuft, sodass
    Zugangsdaten und Daten verschlüsselt werden. Es ist dem einfachen **FTP**
    vorzuziehen, das alles im Klartext überträgt.
