# Glossar der OVHcloud Dokumentation — Deutsch.
#
# Übersetzung von en.yaml. Die Schlüssel müssen in en.yaml existieren und
# werden nie übersetzt. Die Zusammenführung erfolgt feldweise: Ein Eintrag, der
# nur `definition:` angibt, übernimmt `aliases`, `abbreviation` und
# `relatedTerms` aus dem Englischen. Sie werden hier nur dann erneut angegeben,
# wenn sie tatsächlich abweichen (im deutschen Text gebräuchliche Formen).
#
# Links `/links/<key>` und `/guides/...` werden unverändert übernommen: Sie
# werden bei der Generierung pro Sprache aufgelöst.

# --- Produkte und Services --------------------------------------------------

additionalIp:
  definition: >-
    Eine [zusätzliche öffentliche IP-Adresse](/links/network/additional-ip), die
    Sie bestellen und einem kompatiblen OVHcloud Service zuweisen können. Sie
    lässt sich jederzeit von einem Service auf einen anderen übertragen.
  aliases:
    - Failover-IP
    - zusätzliche IP-Adresse

cdnInfrastructure:
  definition: >-
    Das [Content Delivery Network](/links/network/cdn-infrastructure) von
    OVHcloud: Es speichert die Inhalte Ihrer Website in Points of Presence
    weltweit zwischen und beschleunigt so deren Auslieferung an Ihre Besucher.

dedicatedServer:
  definition: >-
    Ein vollständig gemieteter [physischer Server](/links/bare-metal/bare-metal):
    Sie nutzen die Hardware exklusiv und verfügen über einen vollständigen
    administrativen Zugriff.
  aliases:
    - Dedicated Server

emailPro:
  definition: >-
    Das [Angebot für professionelle E-Mails](/links/web/email-pro) von
    OVHcloud: ein dediziertes Postfach pro Benutzer, mit Webmail-Zugang und
    Synchronisierung über alle Geräte hinweg.

hostedExchange:
  definition: >-
    Der [gehostete Microsoft Exchange Service](/links/web/emails-hosted-exchange)
    von OVHcloud: kollaborative E-Mail-Lösung mit gemeinsamen Kalendern,
    Kontakten und Aufgaben, gehostet und verwaltet von OVHcloud.
  aliases:
    - Exchange

loadBalancer:
  definition: >-
    Ein OVHcloud Service, der [eingehenden Traffic](/links/network/load-balancer)
    auf mehrere Ihrer Services verteilt und so deren Verfügbarkeit und
    Performance verbessert.

managedWordpress:
  definition: >-
    Das [Managed WordPress Angebot](/links/web/hosting-wordpress) von OVHcloud:
    OVHcloud übernimmt Installation, Updates und Sicherheit Ihrer
    WordPress-Website, sodass Sie sich auf deren Inhalte konzentrieren können.

mxPlan:
  definition: >-
    Die [Standard-E-Mail-Lösung](/links/web/emails) von OVHcloud, die in
    Domainnamen und Webhosting-Angeboten enthalten ist: Postfächer mit
    Webmail-Zugang sowie Spam- und Virenschutz.

ovhcloudApi:
  definition: >-
    Die RESTful-Schnittstelle zur programmatischen Verwaltung Ihrer OVHcloud
    Services. Sie umfasst alle Funktionen des OVHcloud Kundencenters und
    darüber hinaus. Siehe
    [Erste Schritte mit den OVHcloud APIs](/guides/manage-and-operate/api/first-steps).

ovhcloudConnect:
  definition: >-
    Eine [private und sichere Verbindung](/links/network/ovhcloud-connect)
    zwischen Ihrer eigenen Infrastruktur (Rechenzentrum, Büros) und dem
    OVHcloud Netzwerk.

ovhcloudControlPanel:
  definition: >-
    Die Weboberfläche zur Verwaltung all Ihrer OVHcloud Produkte und Services:
    Bestellung, Konfiguration, Abrechnung und Benutzerverwaltung. Siehe die
    [Anleitung zur Navigation](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - Kundencenter
    - OVHcloud Kundencenter

sslGateway:
  definition: >-
    Ein OVHcloud Service, der [Ihre Website absichert](/links/web/ssl-gateway),
    indem er den Traffic zwischen Besuchern und Ihrem Server per SSL/TLS
    verschlüsselt, ohne dass ein Zertifikat auf dem Server selbst installiert
    werden muss.

vps:
  definition: >-
    Ein [Virtual Private Server](/links/bare-metal/vps): eine virtuelle
    Maschine mit garantierten Ressourcen und vollem Root-Zugriff, gehostet auf
    der Infrastruktur von OVHcloud.
  aliases:
    - Virtual Private Server

vrack:
  definition: >-
    Das [private Netzwerk](/links/network/vrack) von OVHcloud: Es verbindet
    Ihre kompatiblen OVHcloud Services in einem isolierten Netzwerk
    miteinander, auch über verschiedene Rechenzentren hinweg.

webCloudDatabases:
  definition: >-
    Ein [eigenständiger Datenbank-Service](/links/web/databases) für
    Webprojekte, der Ihren Datenbanken dedizierte Ressourcen außerhalb Ihres
    Hostings bereitstellt.

webHosting:
  definition: >-
    Der [Shared-Hosting-Service](/links/web/hosting) von OVHcloud für Ihre
    Websites: Speicherplatz, Datenbanken und CMS-Installation mit einem Klick,
    auf einer von OVHcloud verwalteten Infrastruktur.
  aliases:
    - Webhosting

zimbra:
  definition: >-
    Eine von OVHcloud angebotene
    [Open-Source-Lösung für kollaborative Kommunikation](/links/web/zimbra), die
    E-Mails, Kalender und Kontakte in einer einzigen Webmail-Oberfläche
    vereint.

# --- OVHcloud-spezifische Konzepte ------------------------------------------

anycastDns:
  definition: >-
    Eine [kostenpflichtige DNS-Option](/links/web/domains-options-anycast), die
    Ihre DNS-Zone auf Server weltweit repliziert. DNS-Anfragen werden dadurch
    vom Standort beantwortet, der dem Besucher am nächsten liegt.

automatedBackup:
  definition: >-
    Eine VPS-Option, die automatisch ein
    [tägliches Backup](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    Ihres Servers erstellt, mit mehreren Wiederherstellungspunkten zur Auswahl.
  aliases:
    - automatisiertes Backup

dnsZone:
  definition: >-
    Die Gesamtheit der DNS-Einträge (A, MX, CNAME usw.), die einen
    [Domainnamen](/links/web/domains) mit seinen Diensten verbinden, etwa einer
    Website oder E-Mail-Adressen. Die Verwaltung erfolgt im OVHcloud
    Kundencenter.
  aliases:
    - DNS-Zone

kvmConsole:
  definition: >-
    Eine Remote-Konsole (Keyboard, Video, Mouse), die im OVHcloud Kundencenter
    für VPS und Dedicated Server zur Verfügung steht: Sie erhalten Zugriff auf
    Bildschirm und Tastatur der Maschine, selbst wenn diese über das Netzwerk
    nicht mehr erreichbar ist.
  aliases:
    - KVM-Konsole

multisite:
  definition: >-
    Eine [Webhosting-Funktion](/links/web/hosting-multisite), mit der Sie
    mehrere Websites mit jeweils eigener Domain oder Subdomain auf einem
    einzigen Hosting betreiben können.

ovhconfig:
  definition: >-
    Eine Konfigurationsdatei im Stammverzeichnis des Speicherplatzes Ihres
    Webhostings, die die Laufzeitumgebung Ihrer Website festlegt (PHP-Version,
    Produktions- oder Entwicklungsmodus, Firewall).

snapshot:
  definition: >-
    Ein manuell erstelltes Abbild eines VPS zu einem bestimmten Zeitpunkt, das
    Sie [jederzeit wiederherstellen](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps)
    können. Es wird in der Regel vor einer risikoreichen Änderung erstellt.
