# Glossaire de la documentation OVHcloud — français.
#
# Traduction de en.yaml. Les clés doivent exister dans en.yaml : elles ne sont
# jamais traduites. La fusion se fait champ par champ, donc une entrée qui ne
# fournit que `definition:` conserve les `aliases`, `abbreviation` et
# `relatedTerms` de l'anglais — ils ne sont redéclarés ici que lorsqu'ils
# diffèrent réellement (formes rencontrées dans les textes français).
#
# Les acronymes techniques (TTL, SPF, DKIM, DMARC, IMAP, POP, SMTP, SFTP,
# DNSSEC) ne se traduisent pas : ils restent tels quels, conformément à l'usage
# des guides français.
#
# Les liens `/links/<clé>` et `/guides/...` sont repris tels quels : ils sont
# résolus par locale à la génération.

# --- Notions propres à OVHcloud ---------------------------------------------

anycastDns:
  definition: >-
    Une [option DNS payante](/links/web/domains-options-anycast) qui réplique
    votre zone DNS sur des serveurs répartis dans le monde entier : les requêtes
    DNS sont ainsi traitées depuis l'emplacement le plus proche du visiteur.

automatedBackup:
  definition: >-
    Une option VPS qui crée automatiquement une
    [sauvegarde quotidienne](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    de votre serveur, avec plusieurs points de restauration au choix.
  aliases:
    - sauvegarde automatisée

kvmConsole:
  definition: >-
    Une console à distance (Keyboard, Video, Mouse) disponible pour les VPS et
    les serveurs dédiés dans l'espace client OVHcloud : elle donne accès à
    l'écran et au clavier de la machine, même lorsque celle-ci n'est plus
    joignable par le réseau.
  aliases:
    - console KVM

multisite:
  definition: >-
    Une [fonctionnalité des hébergements web](/links/web/hosting-multisite) qui
    permet d'héberger plusieurs sites web, chacun avec son propre domaine ou
    sous-domaine, sur un même hébergement.

mxPlan:
  definition: >-
    La [solution d'e-mails standard](/links/web/emails) d'OVHcloud, incluse
    avec les noms de domaine et les hébergements web : des adresses e-mail avec
    accès webmail et protection contre les spams et les virus.

ovhcloudApi:
  definition: >-
    L'interface RESTful permettant de gérer vos services OVHcloud par
    programmation. Elle couvre tout ce qui est disponible dans l'espace client
    OVHcloud, et davantage. Consultez le guide
    [Premiers pas avec les API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhconfig:
  definition: >-
    Un fichier de configuration situé à la racine de l'espace de stockage de
    votre hébergement web, qui détermine l'environnement d'exécution de votre
    site (version de PHP, mode production ou développement, pare-feu
    applicatif).

snapshot:
  definition: >-
    Une image manuelle d'un VPS à un instant donné, que vous pouvez
    [restaurer à tout moment](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    généralement réalisée avant une opération à risque.

vrack:
  definition: >-
    Le [réseau privé](/links/network/vrack) d'OVHcloud : il connecte entre eux
    vos services OVHcloud éligibles au sein d'un réseau isolé, y compris entre
    différents datacentres.

zimbra:
  definition: >-
    Une [solution de messagerie collaborative open source](/links/web/zimbra)
    proposée par OVHcloud, qui réunit e-mails, calendriers et contacts au sein
    d'une même interface webmail.

# --- DNS et noms de domaine -------------------------------------------------

aRecord:
  definition: >-
    L'enregistrement DNS qui associe un nom de domaine à une adresse IPv4,
    c'est-à-dire celui qui dirige vos visiteurs vers le serveur hébergeant
    votre site web. Son équivalent en IPv6 est l'enregistrement AAAA.
  aliases:
    - enregistrement A
    - enregistrement AAAA

cname:
  definition: >-
    Un enregistrement DNS qui fait d'un nom l'alias d'un autre : il suit alors
    ce que pointe sa cible. Il est souvent utilisé pour les sous-domaines,
    comme `www`.
  aliases:
    - CNAME
    - enregistrement CNAME

dnsPropagation:
  definition: >-
    Le délai nécessaire pour qu'une modification DNS soit visible partout. Les
    serveurs du monde entier conservent les anciennes valeurs en cache jusqu'à
    l'expiration du **TTL** de l'enregistrement, ce qui peut prendre jusqu'à
    24 heures.
  aliases:
    - propagation
    - propagation DNS

dnsZone:
  definition: >-
    L'ensemble des enregistrements DNS (A, MX, CNAME, etc.) qui relient un
    [nom de domaine](/links/web/domains) à ses services, comme un site web ou
    une messagerie. La zone DNS se gère depuis l'espace client OVHcloud.
  aliases:
    - zone DNS

dnssec:
  definition: >-
    Une extension de sécurité du DNS qui signe les enregistrements de votre
    zone : un résolveur peut ainsi vérifier que la réponse reçue provient bien
    de votre domaine et n'a pas été altérée.

glueRecord:
  definition: >-
    Un enregistrement DNS qui fournit l'adresse IP d'un serveur DNS dont le nom
    appartient au domaine qu'il dessert. Il évite ainsi la boucle de résolution
    qui rendrait le domaine injoignable.
  aliases:
    - glue record

mxRecord:
  definition: >-
    L'enregistrement DNS qui désigne les serveurs de messagerie recevant les
    e-mails d'un domaine. Sa valeur de priorité détermine quel serveur est
    sollicité en premier.
  aliases:
    - enregistrement MX

ttl:
  definition: >-
    *Time To Live* — la durée, en secondes, pendant laquelle les serveurs
    peuvent conserver un enregistrement DNS en cache avant de le vérifier à
    nouveau. Un TTL faible accélère la propagation des modifications, un TTL
    élevé réduit le nombre de requêtes.

wildcard:
  definition: >-
    Une entrée utilisant `*` pour couvrir d'un coup tous les noms d'un même
    niveau : un enregistrement DNS wildcard couvre tous les sous-domaines non
    déclarés, et un certificat SSL wildcard les sécurise tous.
  aliases:
    - enregistrement wildcard

# --- Messagerie -------------------------------------------------------------

catchAll:
  definition: >-
    Une adresse e-mail qui reçoit tous les messages envoyés à une adresse
    inexistante de votre domaine, au lieu de les laisser être rejetés.
  aliases:
    - catch-all

dkim:
  definition: >-
    Une norme de messagerie qui ajoute une signature cryptographique à vos
    e-mails sortants : le serveur destinataire peut ainsi vérifier qu'ils
    proviennent bien de votre domaine et n'ont pas été modifiés en chemin.

dmarc:
  definition: >-
    Une norme de messagerie qui s'appuie sur **SPF** et **DKIM** : elle indique
    aux serveurs destinataires le traitement à appliquer aux messages qui
    échouent à ces vérifications, et l'adresse à laquelle envoyer les rapports.

imap:
  definition: >-
    Un protocole de messagerie qui conserve vos messages sur le serveur et les
    synchronise sur tous vos appareils. Contrairement à **POP**, lire ou
    supprimer un message sur un appareil se répercute partout.

pop:
  definition: >-
    Un protocole de messagerie qui télécharge les messages sur un seul
    appareil, en les supprimant généralement du serveur. Préférez **IMAP** si
    vous consultez vos e-mails depuis plusieurs appareils.

smtp:
  definition: >-
    Le protocole utilisé pour *envoyer* des e-mails. Votre logiciel de
    messagerie se connecte à un serveur SMTP pour transmettre un message,
    tandis qu'**IMAP** et **POP** servent à les consulter.

spf:
  definition: >-
    Un enregistrement DNS qui liste les serveurs autorisés à envoyer des
    e-mails pour votre domaine, afin que les serveurs destinataires puissent
    rejeter les messages usurpant votre adresse.

# --- Hébergement, fichiers et outils ----------------------------------------

cron:
  definition: >-
    Une tâche planifiée qui exécute automatiquement un script à une heure ou
    selon une périodicité définie — par exemple une opération de maintenance
    nocturne sur votre site web.
  aliases:
    - tâche cron
    - tâche planifiée

htaccess:
  definition: >-
    Un fichier de configuration placé dans un répertoire de votre site web pour
    contrôler le comportement du serveur web sur ce dossier : redirections,
    restrictions d'accès, protection par mot de passe et pages d'erreur.
  aliases:
    - .htaccess

phpmyadmin:
  definition: >-
    Une interface web permettant d'administrer une base de données MySQL ou
    MariaDB : consultation des tables, exécution de requêtes, import et export
    de la base — sans passer par la ligne de commande.
  aliases:
    - phpMyAdmin

sftp:
  definition: >-
    Un protocole de transfert de fichiers fonctionnant au sein d'une connexion
    SSH : les identifiants et les données y sont chiffrés. Il est à privilégier
    face au **FTP** classique, qui transmet tout en clair.
