# Glossaire de la documentation OVHcloud — français.
#
# Traduction de en.yaml. Les clés doivent exister dans en.yaml : elles ne sont
# jamais traduites. La fusion se fait champ par champ, donc une entrée qui ne
# fournit que `definition:` conserve les `aliases`, `abbreviation` et
# `relatedTerms` de l'anglais — ils ne sont redéclarés ici que lorsqu'ils
# diffèrent réellement (formes rencontrées dans les textes français).
#
# Les liens `/links/<clé>` et `/guides/...` sont repris tels quels : ils sont
# résolus par locale à la génération.

# --- Produits et services ---------------------------------------------------

additionalIp:
  definition: >-
    Une [adresse IP publique supplémentaire](/links/network/additional-ip) que
    vous pouvez commander et attacher à un service OVHcloud compatible, puis
    déplacer d'un service à un autre à tout moment.
  aliases:
    - IP failover
    - IP supplémentaire

cdnInfrastructure:
  definition: >-
    Le [réseau de diffusion de contenu](/links/network/cdn-infrastructure)
    d'OVHcloud : il met en cache le contenu de votre site web dans des points
    de présence répartis dans le monde entier, afin d'accélérer son affichage
    pour vos visiteurs.

dedicatedServer:
  definition: >-
    Un [serveur physique](/links/bare-metal/bare-metal) loué dans son
    intégralité : vous disposez d'un usage exclusif du matériel, avec un accès
    administrateur complet.
  aliases:
    - serveur dédié

emailPro:
  definition: >-
    L'[offre d'e-mails professionnels](/links/web/email-pro) d'OVHcloud : une
    adresse e-mail dédiée par utilisateur, avec accès webmail et
    synchronisation sur tous vos appareils.

hostedExchange:
  definition: >-
    Le [service Microsoft Exchange hébergé](/links/web/emails-hosted-exchange)
    d'OVHcloud : messagerie collaborative avec calendriers, contacts et tâches
    partagés, hébergée et administrée par OVHcloud.
  aliases:
    - Exchange

loadBalancer:
  definition: >-
    Un service OVHcloud qui [répartit le trafic entrant](/links/network/load-balancer)
    entre plusieurs de vos services, afin d'améliorer leur disponibilité et
    leurs performances.
  aliases:
    - répartiteur de charge

managedWordpress:
  definition: >-
    L'[offre WordPress infogérée](/links/web/hosting-wordpress) d'OVHcloud :
    OVHcloud prend en charge l'installation, les mises à jour et la sécurité de
    votre site WordPress, afin que vous puissiez vous consacrer à son contenu.

mxPlan:
  definition: >-
    La [solution d'e-mails standard](/links/web/emails) d'OVHcloud, incluse
    avec les noms de domaine et les hébergements web : des adresses e-mail avec
    accès webmail et protection contre les spams et les virus.

ovhcloudApi:
  definition: >-
    L'interface RESTful permettant de gérer vos services OVHcloud par
    programmation. Elle couvre tout ce qui est disponible dans l'espace client
    OVHcloud, et davantage. Consultez le guide
    [Premiers pas avec les API OVHcloud](/guides/manage-and-operate/api/first-steps).

ovhcloudConnect:
  definition: >-
    Une [connexion privée et sécurisée](/links/network/ovhcloud-connect) entre
    votre propre infrastructure (datacentre, bureaux) et le réseau OVHcloud.

ovhcloudControlPanel:
  definition: >-
    L'interface web permettant de gérer l'ensemble de vos produits et services
    OVHcloud : commande, configuration, facturation et gestion des
    utilisateurs. Consultez le
    [guide de navigation](/guides/account-and-service-management/account-information/new-control-panel-navigation).
  aliases:
    - espace client
    - espace client OVHcloud

sslGateway:
  definition: >-
    Un service OVHcloud qui [sécurise votre site web](/links/web/ssl-gateway) en
    chiffrant le trafic entre vos visiteurs et votre serveur via SSL/TLS, sans
    avoir à installer de certificat sur le serveur lui-même.

vps:
  definition: >-
    Un [Virtual Private Server](/links/bare-metal/vps) : une machine virtuelle
    disposant de ressources garanties et d'un accès root complet, hébergée sur
    l'infrastructure OVHcloud.
  aliases:
    - Virtual Private Server
    - serveur privé virtuel

vrack:
  definition: >-
    Le [réseau privé](/links/network/vrack) d'OVHcloud : il connecte entre eux
    vos services OVHcloud éligibles au sein d'un réseau isolé, y compris entre
    différents datacentres.

webCloudDatabases:
  definition: >-
    Un [service de bases de données autonome](/links/web/databases) destiné aux
    projets web, qui fournit des ressources dédiées à vos bases de données en
    dehors de votre hébergement.

webHosting:
  definition: >-
    Le [service d'hébergement mutualisé](/links/web/hosting) d'OVHcloud pour
    vos sites web : stockage, bases de données et installation de CMS en un
    clic, sur une infrastructure administrée par OVHcloud.
  aliases:
    - hébergement web
    - hébergement mutualisé

zimbra:
  definition: >-
    Une [solution de messagerie collaborative open source](/links/web/zimbra)
    proposée par OVHcloud, qui réunit e-mails, calendriers et contacts au sein
    d'une même interface webmail.

# --- Notions propres à OVHcloud ---------------------------------------------

anycastDns:
  definition: >-
    Une [option DNS payante](/links/web/domains-options-anycast) qui réplique
    votre zone DNS sur des serveurs répartis dans le monde entier : les requêtes
    DNS sont ainsi traitées depuis l'emplacement le plus proche du visiteur.

automatedBackup:
  definition: >-
    Une option VPS qui crée automatiquement une
    [sauvegarde quotidienne](/guides/bare-metal-cloud/virtual-private-servers/using-automated-backups-on-a-vps)
    de votre serveur, avec plusieurs points de restauration au choix.
  aliases:
    - sauvegarde automatisée

dnsZone:
  definition: >-
    L'ensemble des enregistrements DNS (A, MX, CNAME, etc.) qui relient un
    [nom de domaine](/links/web/domains) à ses services, comme un site web ou
    une messagerie. La zone DNS se gère depuis l'espace client OVHcloud.
  aliases:
    - zone DNS

kvmConsole:
  definition: >-
    Une console à distance (Keyboard, Video, Mouse) disponible pour les VPS et
    les serveurs dédiés dans l'espace client OVHcloud : elle donne accès à
    l'écran et au clavier de la machine, même lorsque celle-ci n'est plus
    joignable par le réseau.
  aliases:
    - console KVM

multisite:
  definition: >-
    Une [fonctionnalité des hébergements web](/links/web/hosting-multisite) qui
    permet d'héberger plusieurs sites web, chacun avec son propre domaine ou
    sous-domaine, sur un même hébergement.

ovhconfig:
  definition: >-
    Un fichier de configuration situé à la racine de l'espace de stockage de
    votre hébergement web, qui détermine l'environnement d'exécution de votre
    site (version de PHP, mode production ou développement, pare-feu
    applicatif).

snapshot:
  definition: >-
    Une image manuelle d'un VPS à un instant donné, que vous pouvez
    [restaurer à tout moment](/guides/bare-metal-cloud/virtual-private-servers/using-snapshots-on-a-vps),
    généralement réalisée avant une opération à risque.
